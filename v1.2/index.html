// 🗄️ SERVER-SYNC via api.php
// Alle Daten als Key/Value in MariaDB. Lokaler Cache mit
// 800ms Debounce-Save. Hintergrund-Polling alle 8s.
// ══════════════════════════════════════════════════════
const API = 'api.php';
function _getFC(){try{const fc=localStorage.getItem('ft_fc')||'FAM001';return fc==='default'?'FAM001':fc;}catch(e){return 'FAM001';}}
function _apiUrl(a=''){const fc=_getFC();return API+(a?'?action='+a+'&fc='+fc:'?fc='+fc);}

// Statistik-Event (fire & forget)
function _trackEvent(type,cid,cname,rid,rlabel,mins=0){
  fetch(_apiUrl('track'),{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({day:new Date().toISOString().split('T')[0],child_id:cid,child_name:cname,
    event_type:type,ref_id:rid,ref_label:rlabel,minutes:mins})}).catch(()=>{});
}

let _cache={},_dirty=false,_saveTimer=null,_everLoaded=false,_failStreak=0;
const FAIL_THRESH=3;
let _lastSeenServerTs=0;

function _setSyncStatus(state,msg){
  const l=document.getElementById('sync-light'),lb=document.getElementById('sync-label');
  if(!l||!lb)return;
  const m={online:{bg:'#6BCB77',anim:'none',txt:'Online'},
    offline:{bg:'#FF6B6B',anim:'none',txt:msg||'Offline'},
    default:{bg:'#FFB347',anim:'syncPulse 1s ease-in-out infinite',txt:msg||'Verbinde…'}};
  const s=m[state]||m.default;
  l.style.background=s.bg;l.style.boxShadow='0 0 7px '+s.bg;
  l.style.animation=s.anim;lb.style.color=s.bg;lb.textContent=s.txt;
}

let _syncStateListeners=[],_syncState='idle';
const _setSyncState=(s,meta={})=>{_syncState=s;_syncStateListeners.forEach(fn=>fn(s,meta));};
window._subscribeSyncState=fn=>{_syncStateListeners.push(fn);fn(_syncState,{});};

// LocalStorage Offline-Fallback
const _lsKeys=['ft-ch','ft-ta','ft-co','ft-mu','ft-pin','ft-timers','ft-fi','ft-fh','ft-mt','ft-ev'];
const _lsClear=()=>{try{_lsKeys.forEach(k=>localStorage.removeItem('ft_'+k));localStorage.removeItem('ft_ts');}catch(e){}};
const _lsSave=()=>{try{Object.entries(_cache).forEach(([k,v])=>localStorage.setItem('ft_'+k,typeof v==='string'?v:JSON.stringify(v)));localStorage.setItem('ft_ts',String(_cache['_ts']||0));}catch(e){}};
const _lsLoad=()=>{if(_everLoaded)return;try{_lsKeys.forEach(k=>{const v=localStorage.getItem('ft_'+k);if(v)_cache[k]=v;});}catch(e){}try{const t=localStorage.getItem('ft_ts');if(t)_cache['_ts']=parseInt(t)||0;}catch(e){}};
window._famtaskClearLocalStorage=()=>{_lsClear();return true;};

// Storage-Adapter
const storage={
  get:(key)=>{const v=_cache[key];return v!==undefined?{value:typeof v==='string'?v:JSON.stringify(v)}:null;},
  set:(key,value)=>{_cache[key]=value;_cache['_ts']=Date.now();_dirty=true;clearTimeout(_saveTimer);_saveTimer=setTimeout(()=>_pushData(),800);return true;}
};

let _reloading=false,_lastPushedTs=0;

async function _loadData(silent=false){
  if(!silent)_setSyncStatus('connecting');
  try{
    const r=await fetch(_apiUrl(),{cache:'no-store',headers:{'Accept':'application/json'}});
    if(r.ok){
      const d=await r.json();
      if(d&&d.error==='not_configured'){_setSyncStatus('offline','Nicht eingerichtet');return false;}
      if(_dirty){_failStreak=0;_setSyncStatus('online');return false;}
      const serverTs=parseInt(d['_ts']||0),isNewer=serverTs>_lastSeenServerTs;
      _lastSeenServerTs=serverTs;
      if(isNewer)_cache=d||{};
      _everLoaded=true;_failStreak=0;_setSyncStatus('online');return isNewer;
    }
    _failStreak++;if(_failStreak>=FAIL_THRESH)_setSyncStatus('offline','Server-Fehler '+r.status);
  }catch(e){
    _failStreak++;if(_failStreak>=FAIL_THRESH)_setSyncStatus('offline',navigator.onLine?'Server nicht erreichbar':'Kein Internet');
    _lsLoad();
  }
  return false;
}

async function _pushData(){
  if(!_dirty)return;
  try{
    const r=await fetch(_apiUrl(),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(_cache)});
    if(r.ok){const p=parseInt(_cache['_ts']||0);_dirty=false;_failStreak=0;_lastPushedTs=p;_lastSeenServerTs=p;_setSyncStatus('online');_lsSave();}
    else{_failStreak++;if(_failStreak>=FAIL_THRESH)_setSyncStatus('offline','Speichern fehlgeschlagen');}
  }catch(e){_failStreak++;if(_failStreak>=FAIL_THRESH)_setSyncStatus('offline',navigator.onLine?'Server nicht erreichbar':'Offline');_lsSave();}
}

window._famtaskManualSync=async()=>{
  _setSyncState('syncing');
  const fmtTs=ts=>ts?new Date(parseInt(ts)).toLocaleTimeString('de-CH',{hour:'2-digit',minute:'2-digit',second:'2-digit'}):'–';
  try{
    const r=await fetch(_apiUrl(),{cache:'no-store',headers:{'Accept':'application/json'}});
    const sd=await r.json();
    if(sd?.error==='not_configured')throw new Error('API nicht konfiguriert');
    const sTs=parseInt(sd['_ts']||0),lTs=parseInt(_cache['_ts']||0),diff=Math.abs(sTs-lTs);
    if(diff<2000){_failStreak=0;_setSyncStatus('online');_setSyncState('ok',{msg:'✅ Bereits synchron.',detail:'Stand: '+fmtTs(sTs||lTs)});}
    else if(sTs>lTs){
      _cache=sd;_everLoaded=true;_dirty=false;_failStreak=0;_lastPushedTs=sTs;_lastSeenServerTs=sTs;
      _lsSave();_setSyncStatus('online');if(window._famtaskReload)window._famtaskReload();
      _setSyncState('ok',{msg:'☁️ Server-Daten übernommen',detail:'Server: '+fmtTs(sTs)+'\nLokal:  '+fmtTs(lTs)+'\nΔ '+Math.round(diff/1000)+'s',winner:'server'});
    }else{
      const pr=await fetch(_apiUrl(),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(_cache)});
      if(!pr.ok)throw new Error('Upload HTTP '+pr.status);
      _dirty=false;_failStreak=0;_lastPushedTs=lTs;_lastSeenServerTs=lTs;_lsSave();_setSyncStatus('online');
      _setSyncState('ok',{msg:'📱 Lokale Daten hochgeladen',detail:'Lokal:  '+fmtTs(lTs)+'\nServer: '+fmtTs(sTs)+'\nΔ '+Math.round(diff/1000)+'s',winner:'local'});
    }
  }catch(e){_setSyncStatus('offline','Sync fehlgeschlagen');_setSyncState('error',{msg:'❌ Sync fehlgeschlagen',detail:e.message});}
};

setInterval(async()=>{if(_dirty)return;const ok=await _loadData(true);if(ok&&window._famtaskReload)window._famtaskReload();},8000);
window.addEventListener('online',()=>_loadData(false));
window.addEventListener('offline',()=>{_failStreak=FAIL_THRESH;_setSyncStatus('offline','Kein Internet');});

const darken=(hex,a=50)=>{const c=(_,i)=>Math.max(0,parseInt(hex.slice(i,i+2),16)-a).toString(16).padStart(2,'0');return '#'+c(0,1)+c(0,3)+c(0,5);};
const fmtMM=s=>{if(s<=0)return'00:00';const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),ss=s%60;return h>0?`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}`:`${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}`;};
// h2r: Hex→"R,G,B" mit Cache (wird hunderte Male aufgerufen)
const _h2rCache={};
const h2r=hex=>{if(_h2rCache[hex])return _h2rCache[hex];const r=`${parseInt(hex.slice(1,3),16)},${parseInt(hex.slice(3,5),16)},${parseInt(hex.slice(5,7),16)}`;return(_h2rCache[hex]=r);};

// ══════════════════════════════════════════════════════
// 🔊 ALARM-SOUND (Web Audio API, kein externes Audio)
// Phase 1 (0-55s): Melodie-Schleife
// Phase 2 (55-60s): Sirene
// ══════════════════════════════════════════════════════
let _alarmCtx=null;
function stopAlarmSound(){if(_alarmCtx){try{_alarmCtx.close();}catch(e){}_alarmCtx=null;}}
function playAlarmSound(){
  stopAlarmSound();
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();_alarmCtx=ctx;
    const now=ctx.currentTime,notes=[523.25,659.25,783.99,1046.5],dur=0.22,gap=0.08;
    const cycleLen=notes.length*(dur+gap)+0.25,phase1End=now+55;let t=now;
    while(t<phase1End){notes.forEach((freq,i)=>{const nt=t+i*(dur+gap);if(nt+dur>phase1End)return;
      const osc=ctx.createOscillator(),gain=ctx.createGain();osc.connect(gain);gain.connect(ctx.destination);
      osc.type='sine';osc.frequency.value=freq;gain.gain.setValueAtTime(0,nt);
      gain.gain.linearRampToValueAtTime(0.45,nt+0.03);gain.gain.setValueAtTime(0.45,nt+dur-0.04);
      gain.gain.linearRampToValueAtTime(0,nt+dur);osc.start(nt);osc.stop(nt+dur+0.01);});t+=cycleLen;}
    const ws=now+55;
    [880,1100].forEach((freq,idx)=>{const osc=ctx.createOscillator(),gain=ctx.createGain();
      osc.connect(gain);gain.connect(ctx.destination);osc.type='sawtooth';
      osc.frequency.setValueAtTime(freq,ws);osc.frequency.linearRampToValueAtTime(freq*1.12,ws+1.2);
      osc.frequency.linearRampToValueAtTime(freq,ws+2.4);osc.frequency.linearRampToValueAtTime(freq*1.12,ws+3.6);
      osc.frequency.linearRampToValueAtTime(freq,ws+4.8);gain.gain.setValueAtTime(0,ws);
      gain.gain.linearRampToValueAtTime(idx===0?0.65:0.45,ws+0.15);gain.gain.setValueAtTime(idx===0?0.65:0.45,ws+4.7);
      gain.gain.linearRampToValueAtTime(0,ws+5.0);osc.start(ws);osc.stop(ws+5.1);});
    setTimeout(()=>{if(_alarmCtx===ctx)stopAlarmSound();},61000);
  }catch(e){}
}

// 🧩 MEDIENTYP-MODAL (eigene Komponente → kein Remount-Bug)
// ══════════════════════════════════════════════════════
function MediaTypeModal({initial,onSave,onClose}){
  const {useState:us,useRef:ur}=React;
  const suggestId=l=>l.toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,20)||'media';
  const isNew=!initial.id;
  const [icon,setIcon]=us(initial.icon||'📺');
  const [color,setColor]=us(initial.color||'#4ECDC4');
  const labelRef=ur(null);
  const handleSave=()=>{
    const label=(labelRef.current?.value||'').trim();if(!label)return;
    const id=initial.id||suggestId(label);
    onSave({...initial,label,icon,color,id,bg:'rgba('+h2r(color)+',.15)',_isNew:!initial.id});
  };
  return(<div className="ft-overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
    <div className="ft-modal">
      <div className="ft-modal-title">{isNew?'Medientyp hinzufügen':'Medientyp bearbeiten'}</div>
      <div className="ft-field"><label className="ft-lbl">Name</label><input ref={labelRef} className="ft-input" defaultValue={initial.label} placeholder="z.B. Gameboy"/></div>
      <div className="ft-field"><label className="ft-lbl">Icon</label><div className="ft-emoji-grid">{MEDIA_ICONS.map(ic=><div key={ic} className={'ft-emoji-opt '+(icon===ic?'sel':'')} onClick={()=>setIcon(ic)}>{ic}</div>)}</div></div>
      <div className="ft-field"><label className="ft-lbl">Farbe</label><div className="ft-col-grid">{MEDIA_COLORS.map(c=><div key={c} className={'ft-col-sw '+(color===c?'sel':'')} style={{background:c}} onClick={()=>setColor(c)}/>)}</div></div>
      <div style={{background:'rgba('+h2r(color)+',.1)',border:'1.5px solid '+color+'44',borderRadius:11,padding:'12px 14px',marginTop:10,display:'flex',alignItems:'center',gap:10}}>
        <span style={{fontSize:26}}>{icon}</span><span style={{fontWeight:800,color:'#fff'}}>{labelRef.current?.value||initial.label||'Vorschau'}</span>
      </div>
      <div className="ft-modal-acts">
        <button className="ft-btn ft-btn-sec" onClick={onClose}>Abbrechen</button>
        <button className="ft-btn ft-btn-pri" style={{background:'linear-gradient(135deg,'+color+','+darken(color,20)+')'}} onClick={handleSave}>Speichern</button>
      </div>
    </div>
  </div>);
}

// ══════════════════════════════════════════════════════
// 🏠 HAUPTKOMPONENTE FamTask
// State: children, tasks, comps, mediaU, fines, fineHits,
//        mediaTypes, calEvents (NEU), timers, adminPin
// ══════════════════════════════════════════════════════
function FamTask({familyCode='default',familyName='',onLogout}){
  const [screen,setScreen]=useState('home');
  const [childTab,setChildTab]=useState('tasks');
  const [adminTab,setAdminTab]=useState('children');
  const [selCid,setSelCid]=useState(null);
  const [children,setChildren]=useState(DEFAULT_CHILDREN);
  const [tasks,setTasks]=useState(DEFAULT_TASKS);
  const [fines,setFines]=useState(DEFAULT_FINES);
  const [fineHits,setFineHits]=useState({});
  const [comps,setComps]=useState({});
  const [mediaU,setMediaU]=useState({});
  const [mediaTypes,setMediaTypes]=useState(DEFAULT_MEDIA_TYPES);
  const [calEvents,setCalEvents]=useState([]); // Kalender-Einträge (NEU)
  const [timers,setTimers]=useState({});
  const [alarms,setAlarms]=useState([]);
  const [timerModal,setTimerModal]=useState(null);
  const [custMin,setCustMin]=useState('');
  const [custSec,setCustSec]=useState('');
  const firedRef=useRef({});
  const [adminPin,setAdminPin]=useState('1234');
  const [pinInput,setPinInput]=useState('');
  const [pinErr,setPinErr]=useState(false);
  const [showPin,setShowPin]=useState(false);
  const [adminOpen,setAdminOpen]=useState(false);
  const [editChild,setEditChild]=useState(null);
  const [editTask,setEditTask]=useState(null);
  const [editFine,setEditFine]=useState(null);
  const [editMediaType,setEditMediaType]=useState(null);
  const [editCalEvent,setEditCalEvent]=useState(null); // Event-Modal (NEU)
  const [bonusModal,setBonusModal]=useState(null);
  const [calOffset,setCalOffset]=useState(0);
  const [calDay,setCalDay]=useState(todayStr());
  const [newPin1,setNewPin1]=useState('');
  const [newPin2,setNewPin2]=useState('');
  const [pinMsg,setPinMsg]=useState('');
  const [loaded,setLoaded]=useState(false);
  const [toast,setToast]=useState(null);
  const nowRef=useRef(new Date());
  const timersRef=useRef({});
  const childrenRef=useRef(DEFAULT_CHILDREN);
  const compsRef=useRef({});
  const tasksRef=useRef(DEFAULT_TASKS);
  const selCidRef=useRef(null);

  useEffect(()=>{timersRef.current=timers;},[timers]);
  useEffect(()=>{childrenRef.current=children;},[children]);
  useEffect(()=>{compsRef.current=comps;},[comps]);
  useEffect(()=>{tasksRef.current=tasks;},[tasks]);
  useEffect(()=>{selCidRef.current=selCid;},[selCid]);

  const showToast=(msg,type='ok')=>{setToast({msg,type});setTimeout(()=>setToast(null),2400);};

  // 1s-Ticker: Uhr, Timer-Chips, Alarm — direktes DOM, kein Re-Render
  useEffect(()=>{
    const tick=()=>{
      const n=new Date();nowRef.current=n;const ms=Date.now();
      const hct=document.getElementById('dom-hdr-clock-t'),hcd=document.getElementById('dom-hdr-clock-d');
      if(hct)hct.textContent=n.toLocaleTimeString('de-CH',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
      if(hcd)hcd.textContent=n.toLocaleDateString('de-CH',{day:'numeric',month:'short'});
      const cct=document.getElementById('dom-child-clock-t'),ccd=document.getElementById('dom-child-clock-d');
      if(cct)cct.textContent=n.toLocaleTimeString('de-CH',{hour:'2-digit',minute:'2-digit'});
      if(ccd)ccd.textContent=n.toLocaleDateString('de-CH',{day:'numeric',month:'short'});
      const _t=timersRef.current,_c=childrenRef.current;
      _c.forEach(c=>{
        const chip=document.getElementById('dom-chip-'+c.id),val=document.getElementById('dom-chip-val-'+c.id);
        if(!chip||!val)return;
        const tmr=_t[c.id];
        if(!tmr){val.textContent='⏱';chip.className='ft-tchip';chip.style.setProperty('--tc',c.color);chip.style.setProperty('--tcr',h2r(c.color));return;}
        const secs=Math.max(0,Math.round((tmr.endsAt-ms)/1000));
        val.textContent=secs>0?fmtMM(secs):'✓';
        chip.className='ft-tchip'+(secs>0?' running':'')+(secs>0&&secs<=60?' urgent':'')+(secs===0?' expired':'');
      });
      const cid=selCidRef.current,ctv=document.getElementById('dom-ctimer-val');
      if(ctv&&cid){const tmr=_t[cid];if(!tmr){ctv.textContent='⏱';ctv.className='ft-ctimer-val';}
        else{const s=Math.max(0,Math.round((tmr.endsAt-ms)/1000));ctv.textContent=s>0?fmtMM(s):'✓';ctv.className='ft-ctimer-val'+(s>0?(s<=60?' urgent':' on'):'');}}
      const cdWrap=document.getElementById('dom-countdown');
      if(cdWrap&&cid){
        const _tasks=tasksRef.current,_comps=compsRef.current,nowMin=n.getHours()*60+n.getMinutes(),dow=n.getDay(),d=todayStr();
        const tt=_tasks.filter(t=>t.assignedTo.includes(cid)&&t.repeatDays.includes(dow)).sort((a,b)=>a.dueTime.localeCompare(b.dueTime));
        let found=null;
        for(const t of tt){if(_comps[cid+'_'+t.id+'_'+d]?.completed)continue;const[h,m]=t.dueTime.split(':').map(Number),tMin=h*60+m;if(tMin>nowMin){found={task:t,secsLeft:(tMin-nowMin)*60-n.getSeconds()};break;}}
        if(found){cdWrap.style.display='flex';const cn=document.getElementById('dom-cd-name'),cv=document.getElementById('dom-cd-val');
          if(cn)cn.textContent=found.task.icon+' '+found.task.title;
          if(cv){const s=found.secsLeft;cv.textContent=s<=0?'00:00:00':[Math.floor(s/3600),Math.floor((s%3600)/60),s%60].map(v=>String(v).padStart(2,'0')).join(':');}
        }else{cdWrap.style.display='none';}
      }
      Object.entries(_t).forEach(([cid2,tmr])=>{if(!tmr)return;if(tmr.endsAt<=ms&&!firedRef.current[cid2]){firedRef.current[cid2]=true;playAlarmSound();setAlarms(a=>a.includes(cid2)?a:[...a,cid2]);}});
    };
    tick();const t=setInterval(tick,1000);return()=>clearInterval(t);
  },[]);

  // Daten laden (einmalig beim Start)
  useEffect(()=>{
    (async()=>{
      await _loadData();
      try{
        const r1=storage.get('ft-ch'),r2=storage.get('ft-ta'),r3=storage.get('ft-co'),r4=storage.get('ft-mu');
        const r5=storage.get('ft-pin'),r6=storage.get('ft-timers'),r7=storage.get('ft-fi'),r8=storage.get('ft-fh');
        const r9=storage.get('ft-mt'),r10=storage.get('ft-ev');
        if(r1)setChildren(JSON.parse(r1.value));if(r2)setTasks(JSON.parse(r2.value));
        if(r3)setComps(JSON.parse(r3.value));if(r4)setMediaU(JSON.parse(r4.value));
        if(r5)setAdminPin(r5.value);if(r6)setTimers(JSON.parse(r6.value));
        if(r7)setFines(JSON.parse(r7.value));if(r8)setFineHits(JSON.parse(r8.value));
        if(r9)setMediaTypes(JSON.parse(r9.value));if(r10)setCalEvents(JSON.parse(r10.value));
      }catch(e){}
      setLoaded(true);
    })();
    window._famtaskReload=()=>{
      try{
        _reloading=true;
        const r1=storage.get('ft-ch'),r2=storage.get('ft-ta'),r3=storage.get('ft-co'),r4=storage.get('ft-mu');
        const r5=storage.get('ft-pin'),r6=storage.get('ft-timers'),r7=storage.get('ft-fi'),r8=storage.get('ft-fh');
        const r9=storage.get('ft-mt'),r10=storage.get('ft-ev');
        if(r1)setChildren(JSON.parse(r1.value));if(r2)setTasks(JSON.parse(r2.value));
        if(r3)setComps(JSON.parse(r3.value));if(r4)setMediaU(JSON.parse(r4.value));
        if(r5)setAdminPin(r5.value);if(r6)setTimers(JSON.parse(r6.value));
        if(r7)setFines(JSON.parse(r7.value));if(r8)setFineHits(JSON.parse(r8.value));
        if(r9)setMediaTypes(JSON.parse(r9.value));if(r10)setCalEvents(JSON.parse(r10.value));
        setTimeout(()=>{_reloading=false;},300);
      }catch(e){_reloading=false;}
    };
  },[]);

  const sv=(k,v)=>{if(_reloading)return;try{storage.set(k,JSON.stringify(v));}catch(e){}};
  useEffect(()=>{if(loaded)sv('ft-ch',children);},[children,loaded]);
  useEffect(()=>{if(loaded)sv('ft-ta',tasks);},[tasks,loaded]);
  useEffect(()=>{if(loaded)sv('ft-co',comps);},[comps,loaded]);
  useEffect(()=>{if(loaded)sv('ft-mu',mediaU);},[mediaU,loaded]);
  useEffect(()=>{if(loaded)sv('ft-timers',timers);},[timers,loaded]);
  useEffect(()=>{if(loaded)sv('ft-fi',fines);},[fines,loaded]);
  useEffect(()=>{if(loaded)sv('ft-fh',fineHits);},[fineHits,loaded]);
  useEffect(()=>{if(loaded)sv('ft-mt',mediaTypes);},[mediaTypes,loaded]);
  useEffect(()=>{if(loaded)sv('ft-ev',calEvents);},[calEvents,loaded]); // NEU
  useEffect(()=>{if(loaded)try{storage.set('ft-pin',adminPin);}catch(e){};},[adminPin,loaded]);

  // Verpasste Aufgaben beim Start bestrafen
  useEffect(()=>{
    if(!loaded)return;
    const d=todayStr(),n=new Date(),nowMin=n.getHours()*60+n.getMinutes(),dow=n.getDay();
    let nc={...comps},nch=[...children],changed=false;
    tasks.forEach(task=>{
      if(!task.repeatDays.includes(dow))return;
      const[dh,dm]=task.dueTime.split(':').map(Number);if(nowMin<dh*60+dm)return;
      task.assignedTo.forEach(cid=>{const key=cid+'_'+task.id+'_'+d,ex=nc[key];
        if(!ex?.completed&&!ex?.penaltyApplied){nc[key]={completed:false,penaltyApplied:true};
          const ci=nch.findIndex(c=>c.id===cid);if(ci>=0){nch[ci]={...nch[ci],earnedMinutes:Math.max(0,nch[ci].earnedMinutes-task.minutesPenalty)};changed=true;_trackEvent('task_missed',cid,nch[ci].name,task.id,task.title,task.minutesPenalty);}}
      });
    });
    if(changed){setChildren(nch);setComps(nc);}
  },[loaded]);

  // Timer-Funktionen
  const startTimer=(cid,secs)=>{setTimers(p=>({...p,[cid]:{endsAt:Date.now()+secs*1000,totalSecs:secs}}));delete firedRef.current[cid];setAlarms(a=>a.filter(x=>x!==cid));showToast('⏱ Timer gestartet!','inf');};
  const stopTimer=cid=>{setTimers(p=>({...p,[cid]:null}));delete firedRef.current[cid];setAlarms(a=>{const n=a.filter(x=>x!==cid);if(!n.length)stopAlarmSound();return n;});};
  const dismissAlarm=cid=>{stopAlarmSound();setAlarms(a=>a.filter(x=>x!==cid));setTimers(p=>({...p,[cid]:null}));};

  // Aufgaben-Hilfsfunktionen
  const getChild=id=>children.find(c=>c.id===id);
  const getByDow=(c,d)=>tasks.filter(t=>t.assignedTo.includes(c)&&t.repeatDays.includes(d)).sort((a,b)=>a.dueTime.localeCompare(b.dueTime));
  const getTodayTasks=cid=>getByDow(cid,new Date().getDay());
  const isDone=(c,t,d=todayStr())=>comps[c+'_'+t+'_'+d]?.completed||false;
  const isMissed=(c,t,d=todayStr())=>{const x=comps[c+'_'+t+'_'+d];return x&&!x.completed&&x.penaltyApplied;};

  const toggleTask=(cid,tid)=>{
    const d=todayStr(),key=cid+'_'+tid+'_'+d,ex=comps[key],task=tasks.find(t=>t.id===tid);
    if(!task)return;
    const n=new Date(),nowMin=n.getHours()*60+n.getMinutes();
    const[dh,dm]=task.dueTime.split(':').map(Number),deadlinePassed=nowMin>=dh*60+dm;
    if(ex?.penaltyApplied&&deadlinePassed)return;
    const child=getChild(cid);
    if(ex?.completed){
      setComps(p=>({...p,[key]:{completed:false,penaltyApplied:false}}));
      setChildren(p=>p.map(c=>c.id===cid?{...c,earnedMinutes:Math.max(0,c.earnedMinutes-task.minutesReward)}:c));
      showToast('Rückgängig','inf');
    }else{
      if(ex?.penaltyApplied&&!deadlinePassed)setChildren(p=>p.map(c=>c.id===cid?{...c,earnedMinutes:c.earnedMinutes+task.minutesPenalty}:c));
      setComps(p=>({...p,[key]:{completed:true,penaltyApplied:false}}));
      setChildren(p=>p.map(c=>c.id===cid?{...c,earnedMinutes:c.earnedMinutes+task.minutesReward}:c));
      _trackEvent('task_done',cid,child?.name||cid,tid,task.title,task.minutesReward);
      showToast('🎉 +'+task.minutesReward+' Min verdient!');
    }
  };
  const saveTask=t=>{if(t.id)setTasks(p=>p.map(x=>x.id===t.id?t:x));else setTasks(p=>[...p,{...t,id:uid()}]);setEditTask(null);showToast('Gespeichert ✓');};
  const delTask=id=>{setTasks(p=>p.filter(t=>t.id!==id));showToast('Gelöscht','inf');};

  // Medien-Hilfsfunktionen
  const getMediaUsed=(c,t)=>mediaU[c+'_'+t+'_'+todayStr()]||0;
  const getWeekStart=()=>{const d=new Date(),dow=d.getDay(),diff=dow===0?-6:1-dow;d.setDate(d.getDate()+diff);return d.toISOString().split('T')[0];};
  const getMediaUsedWeek=(cid,type)=>{const ws=getWeekStart();let tot=0;for(let i=0;i<7;i++){const d=new Date(ws+'T00:00:00');d.setDate(d.getDate()+i);tot+=mediaU[cid+'_'+type+'_'+d.toISOString().split('T')[0]]||0;}return tot;};
  const getMediaAllowedDays=(cid,type)=>{const ch=getChild(cid);if(!ch)return[0,1,2,3,4,5,6];return ch.mediaDays?.[type]??[0,1,2,3,4,5,6];};
  const getWeeklyLimit=(cid,type)=>{const ch=getChild(cid);if(!ch)return 0;return getMediaAllowedDays(cid,type).length*(ch.mediaLimits?.[type]||0);};
  const isMediaAllowedToday=(cid,type)=>getMediaAllowedDays(cid,type).includes(new Date().getDay());

  const useMedia=(cid,type,mins)=>{
    const ch=getChild(cid);if(!ch||ch.earnedMinutes<mins){showToast('Nicht genug Minuten! ⏰','err');return;}
    if(!isMediaAllowedToday(cid,type)){showToast('Heute nicht erlaubt! 🚫','err');return;}
    const mt=mediaTypes.find(m=>m.id===type);
    if(mt?.carryOver){const wr=Math.max(0,getWeeklyLimit(cid,type)-getMediaUsedWeek(cid,type));if(mins>wr){showToast('Wochenbudget erreicht! Noch '+wr+' Min 🚫','err');return;}}
    else{if(getMediaUsed(cid,type)+mins>(ch.mediaLimits?.[type]||0)){showToast('Tageslimit erreicht! 🚫','err');return;}}
    setMediaU(p=>({...p,[cid+'_'+type+'_'+todayStr()]:(p[cid+'_'+type+'_'+todayStr()]||0)+mins}));
    setChildren(p=>p.map(c=>c.id===cid?{...c,earnedMinutes:c.earnedMinutes-mins}:c));
    _trackEvent('media_used',cid,ch.name,type,mt?.label||type,mins);showToast('✅ '+mins+' Min freigeschaltet!');
  };

  // Strafen-Hilfsfunktionen
  const getFineKey=(cid,fid)=>cid+'_'+fid+'_'+todayStr();
  const getFineCount=(cid,fid)=>fineHits[getFineKey(cid,fid)]||0;
  const getTodayFineMinutes=cid=>fines.filter(f=>f.assignedTo.includes(cid)).reduce((sum,f)=>sum+getFineCount(cid,f.id)*f.minutesPenalty,0);
  const applyFine=(cid,fid)=>{
    const fine=fines.find(f=>f.id===fid),child=getChild(cid);if(!fine||!child)return;
    const key=getFineKey(cid,fid);
    setFineHits(p=>({...p,[key]:(p[key]||0)+1}));
    setChildren(p=>p.map(c=>c.id===cid?{...c,earnedMinutes:Math.max(0,c.earnedMinutes-fine.minutesPenalty)}:c));
    _trackEvent('task_missed',cid,child.name,fid,'⚠️ '+fine.title,fine.minutesPenalty);
    showToast('⚠️ -'+fine.minutesPenalty+' Min — '+fine.title,'err');
  };
  const undoFine=(cid,fid)=>{const fine=fines.find(f=>f.id===fid);if(!fine)return;const key=getFineKey(cid,fid),cur=fineHits[key]||0;if(cur<=0)return;setFineHits(p=>({...p,[key]:cur-1}));setChildren(p=>p.map(c=>c.id===cid?{...c,earnedMinutes:c.earnedMinutes+fine.minutesPenalty}:c));showToast('Rückgängig','inf');};
  const saveFine=f=>{if(f.id)setFines(p=>p.map(x=>x.id===f.id?f:x));else setFines(p=>[...p,{...f,id:uid()}]);setEditFine(null);showToast('Gespeichert ✓');};
  const delFine=id=>{setFines(p=>p.filter(f=>f.id!==id));showToast('Gelöscht','inf');};

  // ── Kalender-Event-Funktionen (NEU) ──
  // Gibt Events für einen Tag zurück (auch Multi-Tages-Events)
  const getEventsForDay=(cid,ds)=>calEvents.filter(ev=>{
    const forChild=ev.assignedTo.length===0||ev.assignedTo.includes(cid);if(!forChild)return false;
    if(ev.endDate&&ev.endDate!==ev.date)return ds>=ev.date&&ds<=ev.endDate;
    return ev.date===ds;
  });
  const saveCalEvent=ev=>{if(ev.id)setCalEvents(p=>p.map(x=>x.id===ev.id?ev:x));else setCalEvents(p=>[...p,{...ev,id:'ev_'+uid()}]);setEditCalEvent(null);showToast('Termin gespeichert ✓');};
  const delCalEvent=id=>{setCalEvents(p=>p.filter(e=>e.id!==id));showToast('Termin gelöscht','inf');};

  // Bonus
  const openBonus=cid=>setBonusModal({cid,step:'pin',pinInput:'',pinErr:false,mins:'',reason:BONUS_REASONS[0].label});

        {[{icon:'🔄',lbl:'Sync',col:'#4ECDC4',act:()=>{setMenuOpen(false);if(syncCls!=='ft-bnav-sync-ing')window._famtaskManualSync();},cls:syncCls},{icon:'🏠',lbl:'Home',col:'#FF6B6B',act:()=>{setMenuOpen(false);setScreen('home');}},{icon:'⚙️',lbl:'Admin',col:'#A78BFA',act:()=>{setMenuOpen(false);adminOpen?setScreen('admin'):setShowPin(true);}},{icon:'🗄️',lbl:'API',col:'#FFB347',act:()=>{setMenuOpen(false);window.location.href=apiUrl;}}].concat(pwa.canShow?[{icon:'📲',lbl:'App',col:'#FFE66D',act:handleInstall}]:[]).map(n=><button key={n.lbl} className={'ft-bnav-it '+(n.cls||'')} style={{flex:1,minWidth:60,background:'rgba('+h2r(n.col)+',.08)',border:'1.5px solid rgba('+h2r(n.col)+',.2)',borderRadius:12}} onClick={n.act}><span className="ft-bnav-icon">{n.icon}</span><span className="ft-bnav-lbl" style={{color:n.col}}>{n.lbl}</span></button>)}

        {[{id:'tasks',icon:'✅',lbl:'Aufgaben'},{id:'media',icon:'🎮',lbl:'Medienzeit'},{id:'fines',icon:'⚠️',lbl:'Strafen'},{id:'calendar',icon:'📅',lbl:'Kalender'}].map(n=><button key={n.id} className={'ft-bnav-it '+(childTab===n.id?'active':'')} onClick={()=>{setChildTab(n.id);setMenuOpen(false);}}><span className="ft-bnav-icon">{n.icon}</span><span className="ft-bnav-lbl">{n.lbl}</span></button>)}

// 🔑 LOGIN / FAMILIEN-AUSWAHL (AppRoot)
// ══════════════════════════════════════════════════════
function AppRoot(){
  const {useState:us,useEffect:ue}=React;
  const [fc,setFc]=us(null);
  const [input,setInput]=us('');
  const [name,setName]=us('');
  const [err,setErr]=us('');
  const [loading,setLoading]=us(false);
  const [view,setView]=us('login');
  ue(()=>{let s=localStorage.getItem('ft_fc');if(s==='default'){s='FAM001';localStorage.setItem('ft_fc','FAM001');}const sn=localStorage.getItem('ft_fn');if(s){setFc(s);if(sn)setName(sn);}else setFc('');},[]);
  const verify=async()=>{const code=input.trim().toUpperCase().replace(/[^A-Z0-9]/g,'');if(!code){setErr('Bitte Code eingeben');return;}setLoading(true);setErr('');try{const r=await fetch('api.php?action=verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code})});const d=await r.json();if(d.ok){localStorage.setItem('ft_fc',d.code);localStorage.setItem('ft_fn',d.name);setFc(d.code);setName(d.name);}else setErr(d.msg||'Code ungültig');}catch(e){setErr('Verbindungsfehler');}setLoading(false);};
  const register=async()=>{const n=name.trim()||'Meine Familie';setLoading(true);setErr('');try{const r=await fetch('api.php?action=register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n})});const d=await r.json();if(d.ok){localStorage.setItem('ft_fc',d.code);localStorage.setItem('ft_fn',d.name);setFc(d.code);setName(d.name);}else setErr(d.msg||'Fehler');}catch(e){setErr('Verbindungsfehler');}setLoading(false);};
  const logout=()=>{localStorage.removeItem('ft_fc');localStorage.removeItem('ft_fn');setFc('');setInput('');setName('');};
  if(fc===null)return null;
  if(fc)return <FamTask familyCode={fc} familyName={name} onLogout={logout}/>;
  return(<div style={{minHeight:'100vh',background:'#0D0E1A',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:24,fontFamily:"'Nunito',sans-serif"}}>
    <div style={{marginBottom:28,textAlign:'center'}}><div style={{fontFamily:"'Fredoka One',sans-serif",fontSize:36,display:'flex',alignItems:'center',justifyContent:'center',gap:8,marginBottom:6}}><span style={{background:'linear-gradient(135deg,#FF6B6B,#FFE66D)',WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent'}}>FamTask</span><span>✨</span></div><div style={{fontSize:13,color:'rgba(255,255,255,.35)'}}>Familienorganisation leicht gemacht</div></div>
    <div style={{background:'#161728',border:'1.5px solid rgba(255,255,255,.08)',borderRadius:20,padding:'28px 24px',width:'100%',maxWidth:380}}>
      {view==='login'?(<>
        <div style={{fontSize:18,fontWeight:900,color:'#fff',marginBottom:6}}>Mit Code anmelden</div>
        <div style={{fontSize:13,color:'rgba(255,255,255,.4)',marginBottom:20}}>Gib deinen 6-stelligen Familien-Code ein</div>
        <input style={{width:'100%',background:'#0D0E1A',border:'1.5px solid rgba(255,255,255,.1)',borderRadius:12,color:'#fff',fontSize:22,fontWeight:900,padding:14,outline:'none',textAlign:'center',letterSpacing:'6px',fontFamily:'monospace',marginBottom:12,boxSizing:'border-box'}} placeholder="XXXXXX" maxLength={6} value={input} onChange={e=>setInput(e.target.value.toUpperCase())} onKeyDown={e=>e.key==='Enter'&&verify()} autoCapitalize="characters" autoCorrect="off" spellCheck="false"/>
        {err&&<div style={{fontSize:12,color:'#FF6B6B',fontWeight:700,marginBottom:10,textAlign:'center'}}>{err}</div>}
        <button onClick={verify} disabled={loading} style={{width:'100%',padding:14,background:'linear-gradient(135deg,#FF6B6B,#FF8E53)',border:'none',borderRadius:12,color:'#fff',fontSize:15,fontWeight:900,cursor:'pointer',marginBottom:14}}>{loading?'⏳ Prüfe…':'→ Anmelden'}</button>
        <div style={{textAlign:'center'}}><button onClick={()=>{setView('register');setErr('');}} style={{background:'none',border:'none',color:'rgba(78,205,196,.8)',fontSize:13,fontWeight:700,cursor:'pointer',textDecoration:'underline'}}>Neue Familie erstellen</button></div>
      </>):(<>
        <div style={{fontSize:18,fontWeight:900,color:'#fff',marginBottom:6}}>Neue Familie erstellen</div>
        <div style={{fontSize:13,color:'rgba(255,255,255,.4)',marginBottom:20}}>Du bekommst einen Code zum Teilen</div>
        <label style={{fontSize:11,fontWeight:800,color:'rgba(255,255,255,.4)',textTransform:'uppercase',letterSpacing:.5,display:'block',marginBottom:6}}>Familienname</label>
        <input style={{width:'100%',background:'#0D0E1A',border:'1.5px solid rgba(255,255,255,.1)',borderRadius:12,color:'#fff',fontSize:15,padding:'12px 14px',outline:'none',marginBottom:12,boxSizing:'border-box'}} placeholder="z.B. Familie Müller" value={name} onChange={e=>setName(e.target.value)} onKeyDown={e=>e.key==='Enter'&&register()}/>
        {err&&<div style={{fontSize:12,color:'#FF6B6B',fontWeight:700,marginBottom:10,textAlign:'center'}}>{err}</div>}
        <button onClick={register} disabled={loading} style={{width:'100%',padding:14,background:'linear-gradient(135deg,#4ECDC4,#45B7AA)',border:'none',borderRadius:12,color:'#fff',fontSize:15,fontWeight:900,cursor:'pointer',marginBottom:14}}>{loading?'⏳ Erstelle…':'✨ Familie erstellen'}</button>
        <div style={{textAlign:'center'}}><button onClick={()=>{setView('login');setErr('');}} style={{background:'none',border:'none',color:'rgba(255,255,255,.4)',fontSize:13,fontWeight:700,cursor:'pointer',textDecoration:'underline'}}>← Zurück zur Anmeldung</button></div>
      </>)}
    </div>
    <div style={{marginTop:16,fontSize:11,color:'rgba(255,255,255,.2)'}}>v1.2.0 · Deine Daten bleiben privat</div>
  </div>);
}

const root=ReactDOM.createRoot(document.getElementById('root'));
root.render(<AppRoot/>);
</script>

<script>
// Service Worker (PWA Offline-Support)
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}

// PWA Install State
window._pwa={type:null,prompt:null,canShow:false,installed:false,listeners:[],
  notify(){this.listeners.forEach(fn=>fn(this));},
  subscribe(fn){this.listeners.push(fn);fn(this);},
  install(){if(this.prompt){this.prompt.prompt();this.prompt.userChoice.then(r=>{if(r.outcome==='accepted'){this.installed=true;this.canShow=false;this.notify();}this.prompt=null;});}}
};
const _isStandalone=window.navigator.standalone===true||window.matchMedia('(display-mode: standalone)').matches;
if(_isStandalone){window._pwa.installed=true;window._pwa.canShow=false;}
else{
  const _isIosSafari=/iphone|ipad|ipod/i.test(navigator.userAgent)&&/safari/i.test(navigator.userAgent)&&!/crios|fxios|opios/i.test(navigator.userAgent);
  window._pwa.type=_isIosSafari?'ios':'android';window._pwa.canShow=true;window._pwa.notify();
  if(!_isIosSafari){window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();window._pwa.prompt=e;window._pwa.notify();});}
}
window.addEventListener('appinstalled',()=>{window._pwa.installed=true;window._pwa.canShow=false;window._pwa.notify();});
window.matchMedia('(display-mode: standalone)').addEventListener('change',e=>{if(e.matches){window._pwa.installed=true;window._pwa.canShow=false;window._pwa.notify();}});
</script>
</body>
</html>
