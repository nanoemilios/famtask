    // ─────────────────────────────────────────────────────────────────
    // 🗄️ MariaDB REST-API SYNC
    const API = 'api.php';

    let _cache         = {};
    let _dirty         = false;
    let _saveTimer     = null;
    let _everLoaded    = false;   // true sobald einmal erfolgreich vom Server geladen
    let _failStreak    = 0;       // Anzahl aufeinanderfolgender Fehler
    const FAIL_THRESH  = 3;       // erst nach 3 Fehlern → Ampel Rot

    function _setSyncStatus(state, msg) {
      const light = document.getElementById('sync-light');
      const label = document.getElementById('sync-label');
      if (!light || !label) return;
      if (state === 'online') {
        light.style.background = '#6BCB77';
        light.style.boxShadow  = '0 0 7px #6BCB77';
        light.style.animation  = 'none';
        label.style.color      = '#6BCB77';
        label.textContent      = 'Online';
      } else if (state === 'offline') {
        light.style.background = '#FF6B6B';
        light.style.boxShadow  = '0 0 7px #FF6B6B';
        light.style.animation  = 'none';
        label.style.color      = '#FF6B6B';
        label.textContent      = msg || 'Offline';
      } else {
        light.style.background = '#FFB347';
        light.style.boxShadow  = '0 0 7px #FFB347';
        light.style.animation  = 'syncPulse 1s ease-in-out infinite';
        label.style.color      = '#FFB347';
        label.textContent      = msg || 'Verbinde…';
      }
    }

    // localStorage: NUR als Notfall-Fallback beim allerersten Start ohne Server
    const _lsKeys   = ["ft-ch","ft-ta","ft-co","ft-mu","ft-pin","ft-timers"];
    const _lsClear  = () => { try { _lsKeys.forEach(k => localStorage.removeItem("ft_"+k)); } catch(e){} };
    const _lsSave   = () => { try { Object.entries(_cache).forEach(([k,v]) => localStorage.setItem("ft_"+k, typeof v==="string"?v:JSON.stringify(v))); } catch(e){} };
    // _lsLoad nur wenn noch nie vom Server geladen (erster Start, Server nicht erreichbar)
    const _lsLoad   = () => {
      if (_everLoaded) return; // niemals lokale Daten über Server-Daten schreiben!
      try { _lsKeys.forEach(k => { const v=localStorage.getItem("ft_"+k); if(v) _cache[k]=v; }); } catch(e){}
    };

    // localStorage löschen — von Admin-Button aufrufbar
    window._famtaskClearLocalStorage = () => {
      _lsClear();
      return true;
    };

    const storage = {
      get: (key) => { const v=_cache[key]; return v!==undefined?{value:typeof v==="string"?v:JSON.stringify(v)}:null; },
      set: (key, value) => { _cache[key]=value; _dirty=true; clearTimeout(_saveTimer); _saveTimer=setTimeout(()=>_pushData(),800); return true; }
    };

    // silent=true → keine Ampel-Animation beim Hintergrund-Polling
    async function _loadData(silent=false) {
      if (!silent) _setSyncStatus('connecting');
      try {
        const r = await fetch(API, { cache: 'no-store' });
        if (r.ok) {
          const d = await r.json();
          if (d && d.error === 'not_configured') {
            _setSyncStatus('offline', 'Nicht eingerichtet → api.php öffnen');
            return false;
          }
          _cache      = d || {};
          _everLoaded = true;
          _failStreak = 0;
          _setSyncStatus('online');
          return true;
        }
        // Server-Fehler (4xx/5xx)
        _failStreak++;
        if (_failStreak >= FAIL_THRESH)
          _setSyncStatus('offline', 'Server-Fehler ' + r.status);
      } catch(e) {
        _failStreak++;
        if (_failStreak >= FAIL_THRESH)
          _setSyncStatus('offline', navigator.onLine ? 'Server nicht erreichbar' : 'Kein Internet');
        // localStorage nur beim allerersten Start ohne Serververbindung laden
        _lsLoad();
      }
      return false;
    }

    async function _pushData() {
      if (!_dirty) return;
      try {
        const r = await fetch(API, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(_cache)
        });
        if (r.ok) {
          _dirty      = false;
          _failStreak = 0;
          _setSyncStatus('online');
          _lsSave(); // lokale Kopie als reines Offline-Backup aktuell halten
        } else {
          _failStreak++;
          if (_failStreak >= FAIL_THRESH)
            _setSyncStatus('offline', 'Speichern fehlgeschlagen');
        }
      } catch(e) {
        _failStreak++;
        if (_failStreak >= FAIL_THRESH)
          _setSyncStatus('offline', navigator.onLine ? 'Server nicht erreichbar' : 'Offline');
        _lsSave(); // offline: lokal sichern
      }
    }

    // Hintergrund-Polling alle 8s — silent damit die Ampel stabil bleibt
    setInterval(async () => {
      if (_dirty) return;
      const ok = await _loadData(true); // silent!
      if (ok && window._famtaskReload) window._famtaskReload();
    }, 8000);

    window.addEventListener('online',  () => _loadData(false));
    window.addEventListener('offline', () => { _failStreak = FAIL_THRESH; _setSyncStatus('offline', 'Kein Internet'); });

    let _alarmCtx = null;

    function stopAlarmSound() {
      if (_alarmCtx) { try { _alarmCtx.close(); } catch(e){} _alarmCtx = null; }
    }

    function playAlarmSound() {
      stopAlarmSound();
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        _alarmCtx = ctx;
        const now = ctx.currentTime;

        // Phase 1: Melodie wiederholen für 55 Sekunden
        const notes   = [523.25, 659.25, 783.99, 1046.5];
        const dur = 0.22, gap = 0.08;
        const cycleLen = notes.length * (dur + gap) + 0.25;
        const phase1End = now + 55;
        let t = now;
        while (t < phase1End) {
          notes.forEach((freq, i) => {
            const nt = t + i * (dur + gap);
            if (nt + dur > phase1End) return;
            const osc = ctx.createOscillator(), gain = ctx.createGain();
            osc.connect(gain); gain.connect(ctx.destination);
            osc.type = "sine"; osc.frequency.value = freq;
            gain.gain.setValueAtTime(0, nt);
            gain.gain.linearRampToValueAtTime(0.45, nt + 0.03);
            gain.gain.setValueAtTime(0.45, nt + dur - 0.04);
            gain.gain.linearRampToValueAtTime(0, nt + dur);
            osc.start(nt); osc.stop(nt + dur + 0.01);
          });
          t += cycleLen;
        }

        // Phase 2: 5-Sekunden lauter Sirenen-Schlusston (55s bis 60s)
        const warnStart = now + 55;
        [880, 1100].forEach((freq, idx) => {
          const osc  = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain); gain.connect(ctx.destination);
          osc.type = "sawtooth";
          osc.frequency.setValueAtTime(freq,        warnStart);
          osc.frequency.linearRampToValueAtTime(freq * 1.12, warnStart + 1.2);
          osc.frequency.linearRampToValueAtTime(freq,        warnStart + 2.4);
          osc.frequency.linearRampToValueAtTime(freq * 1.12, warnStart + 3.6);
          osc.frequency.linearRampToValueAtTime(freq,        warnStart + 4.8);
          gain.gain.setValueAtTime(0, warnStart);
          gain.gain.linearRampToValueAtTime(idx === 0 ? 0.65 : 0.45, warnStart + 0.15);
          gain.gain.setValueAtTime(idx === 0 ? 0.65 : 0.45, warnStart + 4.7);
          gain.gain.linearRampToValueAtTime(0, warnStart + 5.0);
          osc.start(warnStart); osc.stop(warnStart + 5.1);
        });

        // Automatisch nach 60 Sekunden stoppen
        setTimeout(() => { if (_alarmCtx === ctx) stopAlarmSound(); }, 61000);

      } catch(e) {}
    }

    function FamTask() {
      const [screen,setScreen]=useState("home");
      const [childTab,setChildTab]=useState("tasks");
      const [adminTab,setAdminTab]=useState("children");
      const [selCid,setSelCid]=useState(null);
      const [children,setChildren]=useState(DEFAULT_CHILDREN);
      const [tasks,setTasks]=useState(DEFAULT_TASKS);
      const [comps,setComps]=useState({});
      const [mediaU,setMediaU]=useState({});
      const [timers,setTimers]=useState({});
      const [alarms,setAlarms]=useState([]);
      const [timerModal,setTimerModal]=useState(null);
      const [custMin,setCustMin]=useState("");
      const [custSec,setCustSec]=useState("");
      const firedRef=useRef({});
      const [adminPin,setAdminPin]=useState("1234");
      const [pinInput,setPinInput]=useState("");
      const [pinErr,setPinErr]=useState(false);
      const [showPin,setShowPin]=useState(false);
      const [adminOpen,setAdminOpen]=useState(false);
      const [editChild,setEditChild]=useState(null);
      const [editTask,setEditTask]=useState(null);
      const [calOffset,setCalOffset]=useState(0);
      const [calDay,setCalDay]=useState(todayStr());
      const [newPin1,setNewPin1]=useState("");
      const [newPin2,setNewPin2]=useState("");
      const [pinMsg,setPinMsg]=useState("");
      const nowRef=useRef(new Date());
      const timersRef=useRef({});
      const childrenRef=useRef(DEFAULT_CHILDREN);
      const compsRef=useRef({});
      const tasksRef=useRef(DEFAULT_TASKS);
      const selCidRef=useRef(null);
      const [loaded,setLoaded]=useState(false);
      const [toast,setToast]=useState(null);

      useEffect(()=>{timersRef.current=timers;},[timers]);
      useEffect(()=>{childrenRef.current=children;},[children]);
      useEffect(()=>{compsRef.current=comps;},[comps]);
      useEffect(()=>{tasksRef.current=tasks;},[tasks]);
      useEffect(()=>{selCidRef.current=selCid;},[selCid]);

      const showToast=(msg,type="ok")=>{setToast({msg,type});setTimeout(()=>setToast(null),2400);};
      useEffect(()=>{
        const tick=()=>{
          const n=new Date();
          nowRef.current=n;
          const ms=Date.now();

          // ── Header clock ──
          const hct=document.getElementById('dom-hdr-clock-t');
          const hcd=document.getElementById('dom-hdr-clock-d');
          if(hct)hct.textContent=n.toLocaleTimeString("de-CH",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
          if(hcd)hcd.textContent=n.toLocaleDateString("de-CH",{day:"numeric",month:"short"});

          // ── Child screen clock ──
          const cct=document.getElementById('dom-child-clock-t');
          const ccd=document.getElementById('dom-child-clock-d');
          if(cct)cct.textContent=n.toLocaleTimeString("de-CH",{hour:"2-digit",minute:"2-digit"});
          if(ccd)ccd.textContent=n.toLocaleDateString("de-CH",{day:"numeric",month:"short"});

          const _timers=timersRef.current;
          const _children=childrenRef.current;

          // ── Timer chips ──
          _children.forEach(c=>{
            const chip=document.getElementById('dom-chip-'+c.id);
            const val=document.getElementById('dom-chip-val-'+c.id);
            if(!chip||!val)return;
            const tmr=_timers[c.id];
            if(!tmr){val.textContent='⏱';chip.className='ft-tchip';chip.style.setProperty('--tc',c.color);chip.style.setProperty('--tcr',h2r(c.color));return;}
            const secs=Math.max(0,Math.round((tmr.endsAt-ms)/1000));
            val.textContent=secs>0?fmtMM(secs):'✓';
            chip.className='ft-tchip'+(secs>0?' running':'')+(secs>0&&secs<=60?' urgent':'')+(secs===0?' expired':'');
          });

          // ── Child screen timer pill ──
          const cid=selCidRef.current;
          const ctv=document.getElementById('dom-ctimer-val');
          if(ctv&&cid){
            const tmr=_timers[cid];
            if(!tmr){ctv.textContent='⏱';ctv.className='ft-ctimer-val';}
            else{const s=Math.max(0,Math.round((tmr.endsAt-ms)/1000));ctv.textContent=s>0?fmtMM(s):'✓';ctv.className='ft-ctimer-val'+(s>0?(s<=60?' urgent':' on'):'');}
          }

          // ── Countdown to next task ──
          const cdWrap=document.getElementById('dom-countdown');
          if(cdWrap&&cid){
            const _tasks=tasksRef.current,_comps=compsRef.current,nowMin=n.getHours()*60+n.getMinutes(),dow=n.getDay(),d=todayStr();
            const tt=_tasks.filter(t=>t.assignedTo.includes(cid)&&t.repeatDays.includes(dow)).sort((a,b)=>a.dueTime.localeCompare(b.dueTime));
            let found=null;
            for(const t of tt){if(_comps[`${cid}_${t.id}_${d}`]?.completed)continue;const[h,m]=t.dueTime.split(":").map(Number),tMin=h*60+m;if(tMin>nowMin){found={task:t,secsLeft:(tMin-nowMin)*60-n.getSeconds()};break;}}
            if(found){
              cdWrap.style.display='flex';
              const cn=document.getElementById('dom-cd-name');const cv=document.getElementById('dom-cd-val');
              if(cn)cn.textContent=found.task.icon+' '+found.task.title;

          task.assignedTo.forEach(cid=>{const key=`${cid}_${task.id}_${d}`,ex=nc[key];
            if(!ex?.completed&&!ex?.penaltyApplied){nc[key]={completed:false,penaltyApplied:true};const ci=nch.findIndex(c=>c.id===cid);if(ci>=0){nch[ci]={...nch[ci],earnedMinutes:Math.max(0,nch[ci].earnedMinutes-task.minutesPenalty)};changed=true;}}

      const startTimer=(cid,secs)=>{setTimers(p=>({...p,[cid]:{endsAt:Date.now()+secs*1000,totalSecs:secs}}));delete firedRef.current[cid];setAlarms(a=>a.filter(x=>x!==cid));showToast("⏱ Timer gestartet!","inf");};
      const stopTimer=cid=>{setTimers(p=>({...p,[cid]:null}));delete firedRef.current[cid];setAlarms(a=>{const n=a.filter(x=>x!==cid);if(!n.length)stopAlarmSound();return n;});};
      const dismissAlarm=cid=>{stopAlarmSound();setAlarms(a=>a.filter(x=>x!==cid));setTimers(p=>({...p,[cid]:null}));};
      const getTimerSecs=cid=>{const t=timers[cid];if(!t)return null;return Math.max(0,Math.round((t.endsAt-Date.now())/1000));};
      const getTimerPct=cid=>{const t=timers[cid];if(!t||!t.totalSecs)return 0;const s=getTimerSecs(cid);return Math.min(100,(s/t.totalSecs)*100);};
      const getChild=id=>children.find(c=>c.id===id);
      const getByDow=(c,d)=>tasks.filter(t=>t.assignedTo.includes(c)&&t.repeatDays.includes(d)).sort((a,b)=>a.dueTime.localeCompare(b.dueTime));

      const isMissed=(c,t,d=todayStr())=>{const x=comps[`${c}_${t}_${d}`];return x&&!x.completed&&x.penaltyApplied;};
      const getMediaUsed=(c,t)=>mediaU[`${c}_${t}_${todayStr()}`]||0;
      const toggleTask=(cid,tid)=>{const d=todayStr(),key=`${cid}_${tid}_${d}`,ex=comps[key],task=tasks.find(t=>t.id===tid);if(!task||ex?.penaltyApplied)return;if(ex?.completed){setComps(p=>({...p,[key]:{completed:false,penaltyApplied:false}}));setChildren(p=>p.map(c=>c.id===cid?{...c,earnedMinutes:Math.max(0,c.earnedMinutes-task.minutesReward)}:c));showToast("Rückgängig","inf");}else{setComps(p=>({...p,[key]:{completed:true,penaltyApplied:false}}));setChildren(p=>p.map(c=>c.id===cid?{...c,earnedMinutes:c.earnedMinutes+task.minutesReward}:c));showToast(`🎉 +${task.minutesReward} Min verdient!`);}};

      };

      const AdminChildren=()=>(<div>{children.map(c=>(<div key={c.id} className="ft-aitem"><div style={{width:34,height:34,borderRadius:10,background:c.color,display:"flex",alignItems:"center",justifyContent:"center",fontSize:18,flexShrink:0}}>{c.emoji}</div><div className="ft-aitem-info"><div className="ft-aitem-title">{c.name}</div><div className="ft-aitem-sub">📺 {c.mediaLimits.tv}' · 📱 {c.mediaLimits.tablet}' · 🎮 {c.mediaLimits.nintendo}' | ⏱️ {c.earnedMinutes} Min</div></div><div className="ft-aitem-actions"><button className="ft-ic-btn" onClick={()=>setEditChild({...c})}>✏️</button><button className="ft-ic-btn del" onClick={()=>delChild(c.id)}>🗑️</button></div></div>))}<button className="ft-add-btn" onClick={()=>setEditChild({name:"",color:COLORS[0],emoji:EMOJIS[0],earnedMinutes:0,mediaLimits:{tv:60,tablet:60,nintendo:60},mediaDays:{tv:[0,1,2,3,4,5,6],tablet:[0,1,2,3,4,5,6],nintendo:[0,1,2,3,4,5,6]}})}>+ Kind hinzufügen</button></div>);
      const AdminTasks=()=>(<div>{tasks.map(t=>{const names=children.filter(c=>t.assignedTo.includes(c.id)).map(c=>c.name).join(", ")||"niemand";return(<div key={t.id} className="ft-aitem"><div style={{fontSize:24,flexShrink:0}}>{t.icon}</div><div className="ft-aitem-info"><div className="ft-aitem-title">{t.title}</div><div className="ft-aitem-sub">+{t.minutesReward}' / -{t.minutesPenalty}' · {t.dueTime} · {names}</div></div><div className="ft-aitem-actions"><button className="ft-ic-btn" onClick={()=>setEditTask({...t})}>✏️</button><button className="ft-ic-btn del" onClick={()=>delTask(t.id)}>🗑️</button></div></div>);})}<button className="ft-add-btn" onClick={()=>setEditTask({title:"",icon:"📚",assignedTo:[],minutesReward:10,minutesPenalty:5,dueTime:"18:00",repeatDays:[1,2,3,4,5]})}>+ Aufgabe hinzufügen</button></div>);

      const AdminSettings=()=>{
        const [lsCleared,setLsCleared]=React.useState(false);
        const clearLs=()=>{window._famtaskClearLocalStorage();setLsCleared(true);showToast("LocalStorage gelöscht ✓","inf");setTimeout(()=>setLsCleared(false),3000);};
        return(<div><div className="ft-set-card"><div className="ft-set-title">🔐 Admin-PIN ändern</div><div className="ft-field"><input className="ft-input" type="password" placeholder="Neuer PIN (4 Ziffern)" maxLength={4} value={newPin1} onChange={e=>setNewPin1(e.target.value)} inputMode="numeric"/></div><div className="ft-field"><input className="ft-input" type="password" placeholder="PIN bestätigen" maxLength={4} value={newPin2} onChange={e=>setNewPin2(e.target.value)} inputMode="numeric"/></div>{pinMsg&&<div style={{color:pinMsg.includes("✅")?"#6BCB77":"#FF6B6B",fontWeight:700,fontSize:11,marginBottom:8}}>{pinMsg}</div>}<button className="ft-btn ft-btn-pri" style={{width:"100%"}} onClick={()=>{if(!/^\d{4}$/.test(newPin1)){setPinMsg("PIN muss 4 Ziffern sein");return;}if(newPin1!==newPin2){setPinMsg("PINs stimmen nicht überein");return;}setAdminPin(newPin1);setNewPin1("");setNewPin2("");setPinMsg("✅ PIN geändert!");setTimeout(()=>setPinMsg(""),2000);}}>PIN speichern</button></div>
        <div className="ft-set-card"><div className="ft-set-title">🗑️ LocalStorage löschen</div><div style={{fontSize:12,color:"rgba(255,255,255,0.4)",marginBottom:10,lineHeight:1.5}}>Löscht den lokalen Browser-Cache dieses Geräts. Nützlich wenn dieses Gerät andere Daten zeigt als die anderen. Die Daten auf dem Server bleiben erhalten und werden sofort neu geladen.</div><button className="ft-warn-btn" style={{marginTop:0,background:lsCleared?"rgba(107,203,119,0.1)":"rgba(255,107,107,0.09)",borderColor:lsCleared?"rgba(107,203,119,0.3)":"rgba(255,107,107,0.28)",color:lsCleared?"#6BCB77":"#FF6B6B"}} onClick={clearLs}>{lsCleared?"✅ LocalStorage geleert":"🗑️ LocalStorage jetzt löschen"}</button></div>
        {children.map(c=>(<div key={c.id} className="ft-set-card"><div className="ft-set-title">{c.emoji} {c.name}</div>{MEDIA.map(m=>{const used=getMediaUsed(c.id,m.id),lim=c.mediaLimits[m.id];return<div key={m.id} className="ft-set-row"><span style={{fontSize:11,color:"rgba(255,255,255,0.55)",fontWeight:700}}>{m.icon} {m.label}</span><span style={{fontSize:11,color:"rgba(255,255,255,0.38)",fontWeight:700}}>{used}/{lim} Min</span></div>;})}<button className="ft-warn-btn" onClick={()=>{const d=todayStr();setMediaU(p=>{const n={...p};["tv","tablet","nintendo"].forEach(t=>{delete n[`${c.id}_${t}_${d}`];});return n;});showToast(`Medien für ${c.name} zurückgesetzt`,"inf");}}>Medienkonsum zurücksetzen</button><button className="ft-warn-btn" style={{marginTop:5,borderColor:"rgba(255,165,0,0.3)",color:"#FFB347",background:"rgba(255,165,0,0.07)"}} onClick={()=>{setChildren(p=>p.map(x=>x.id===c.id?{...x,earnedMinutes:0}:x));showToast(`Minuten für ${c.name} zurückgesetzt`,"inf");}}>Verdiente Minuten auf 0</button></div>))}</div>);
      };

      const AdminScreen=()=>(<div className="ft-admin"><div className="ft-admin-hdr"><button className="ft-back" style={{background:"rgba(255,255,255,0.07)"}} onClick={()=>setScreen("home")}>←</button><div className="ft-admin-title">⚙️ Admin</div></div><div className="ft-tabs">{[{id:"children",lbl:"👨‍👩‍👧 Kinder"},{id:"tasks",lbl:"📋 Aufgaben"},{id:"settings",lbl:"⚙️ Einstellungen"}].map(t=><button key={t.id} className={`ft-tab ${adminTab===t.id?"active":""}`} onClick={()=>setAdminTab(t.id)}>{t.lbl}</button>)}</div><div className="ft-admin-body">{adminTab==="children"&&<AdminChildren/>}{adminTab==="tasks"&&<AdminTasks/>}{adminTab==="settings"&&<AdminSettings/>}</div></div>);

      const readImg=(file,cb)=>{if(!file)return;const r=new FileReader();r.onload=e=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas'),max=400;let w=img.width,h=img.height;if(w>h){if(w>max){h=h*max/w;w=max;}}else{if(h>max){w=w*max/h;h=max;}}c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);cb(c.toDataURL('image/jpeg',0.75));};img.src=e.target.result;};r.readAsDataURL(file);};

      const ChildModal=()=>{if(!editChild)return null;const isNew=!editChild.id,u=(k,v)=>setEditChild(p=>({...p,[k]:v})),ul=(k,v)=>setEditChild(p=>({...p,mediaLimits:{...p.mediaLimits,[k]:parseInt(v)||0}}));return(<div className="ft-overlay" onClick={e=>e.target===e.currentTarget&&setEditChild(null)}><div className="ft-modal"><div className="ft-modal-title">{isNew?"Kind hinzufügen":"Kind bearbeiten"}</div>
        <div className="ft-field"><label className="ft-lbl">Foto</label>
          <div className="ft-img-upload" onClick={()=>document.getElementById('child-img-in').click()}>
            {editChild.image?<img src={editChild.image} className="ft-img-preview" alt=""/>:<div className="ft-img-placeholder">🧒</div>}
            <div className="ft-img-info"><div className="ft-img-title">Foto hochladen</div><div className="ft-img-sub">JPG oder PNG, max. 5 MB</div>{editChild.image&&<span className="ft-img-remove" onClick={e=>{e.stopPropagation();u('image',null);}}>✕ Entfernen</span>}</div>
          </div>
          <input id="child-img-in" type="file" accept="image/*" style={{display:'none'}} onChange={e=>readImg(e.target.files[0],img=>u('image',img))}/>
        </div>
        <div className="ft-field"><label className="ft-lbl">Name</label><input className="ft-input" value={editChild.name} onChange={e=>u("name",e.target.value)} placeholder="Name"/></div>
        <div className="ft-field"><label className="ft-lbl">Emoji (falls kein Foto)</label><div className="ft-emoji-grid">{EMOJIS.map(e=><div key={e} className={`ft-emoji-opt ${editChild.emoji===e?"sel":""}`} onClick={()=>u("emoji",e)}>{e}</div>)}</div></div>
        <div className="ft-field"><label className="ft-lbl">Farbe</label><div className="ft-col-grid">{COLORS.map(c=><div key={c} className={`ft-col-sw ${editChild.color===c?"sel":""}`} style={{background:c}} onClick={()=>u("color",c)}/>)}</div></div>
        <div className="ft-field"><label className="ft-lbl">Medienlimits/Tag (Min) &amp; Erlaubte Tage</label>{MEDIA.map(m=>{const days=editChild.mediaDays?.[m.id]??[0,1,2,3,4,5,6];const togDay=i=>{const cur=editChild.mediaDays??{tv:[0,1,2,3,4,5,6],tablet:[0,1,2,3,4,5,6],nintendo:[0,1,2,3,4,5,6]};const nd=cur[m.id].includes(i)?cur[m.id].filter(x=>x!==i):[...cur[m.id],i].sort((a,b)=>a-b);u("mediaDays",{...cur,[m.id]:nd});};return(<div key={m.id} className="ft-field" style={{background:"rgba(255,255,255,0.03)",borderRadius:11,padding:"10px 12px",marginBottom:6}}><div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}><span style={{fontSize:16}}>{m.icon}</span><label className="ft-lbl" style={{margin:0,flex:1}}>{m.label}</label><input className="ft-input" type="number" value={editChild.mediaLimits[m.id]} onChange={e=>ul(m.id,e.target.value)} min={0} style={{width:70,textAlign:"center",padding:"5px 8px"}}/><span style={{fontSize:11,color:"rgba(255,255,255,0.35)",fontWeight:700}}>Min</span></div><div style={{display:"flex",gap:3}}>{DAYS_S.map((d,i)=><button key={i} type="button" onClick={()=>togDay(i)} style={{flex:1,padding:"5px 2px",background:days.includes(i)?"rgba(255,255,255,0.12)":"transparent",border:days.includes(i)?`1.5px solid ${m.color}`:"1.5px solid rgba(255,255,255,0.1)",borderRadius:7,color:days.includes(i)?"#fff":"rgba(255,255,255,0.25)",fontSize:10,fontWeight:800,cursor:"pointer"}}>{d}</button>)}</div></div>);})}</div>
        {isNew&&<div className="ft-field"><label className="ft-lbl">Startminuten</label><input className="ft-input" type="number" value={editChild.earnedMinutes} onChange={e=>u("earnedMinutes",parseInt(e.target.value)||0)} min={0}/></div>}
        <div className="ft-modal-acts"><button className="ft-btn ft-btn-sec" onClick={()=>setEditChild(null)}>Abbrechen</button><button className="ft-btn ft-btn-pri" onClick={()=>editChild.name.trim()&&saveChild(editChild)}>Speichern</button></div>
      </div></div>);};

      const TaskModal=()=>{if(!editTask)return null;const isNew=!editTask.id,u=(k,v)=>setEditTask(p=>({...p,[k]:v})),togDay=d=>u("repeatDays",editTask.repeatDays.includes(d)?editTask.repeatDays.filter(x=>x!==d):[...editTask.repeatDays,d]),togAssign=cid=>u("assignedTo",editTask.assignedTo.includes(cid)?editTask.assignedTo.filter(x=>x!==cid):[...editTask.assignedTo,cid]);return(<div className="ft-overlay" onClick={e=>e.target===e.currentTarget&&setEditTask(null)}><div className="ft-modal"><div className="ft-modal-title">{isNew?"Aufgabe hinzufügen":"Aufgabe bearbeiten"}</div>
        <div className="ft-field"><label className="ft-lbl">Bild</label>
          <div className="ft-img-upload" onClick={()=>document.getElementById('task-img-in').click()}>
            {editTask.image?<img src={editTask.image} className="ft-img-preview-sq" alt=""/>:<div className="ft-img-placeholder-sq">{editTask.icon||"📋"}</div>}
            <div className="ft-img-info"><div className="ft-img-title">Bild hochladen</div><div className="ft-img-sub">Ersetzt das Emoji-Icon</div>{editTask.image&&<span className="ft-img-remove" onClick={e=>{e.stopPropagation();u('image',null);}}>✕ Entfernen</span>}</div>
          </div>
          <input id="task-img-in" type="file" accept="image/*" style={{display:'none'}} onChange={e=>readImg(e.target.files[0],img=>u('image',img))}/>
        </div>
        <div className="ft-field"><label className="ft-lbl">Titel</label><input className="ft-input" value={editTask.title} onChange={e=>u("title",e.target.value)} placeholder="z.B. Zimmer aufräumen"/></div>
        <div className="ft-field"><label className="ft-lbl">Icon (falls kein Bild)</label><div className="ft-emoji-grid">{TASK_ICONS.map(ic=><div key={ic} className={`ft-emoji-opt ${editTask.icon===ic?"sel":""}`} onClick={()=>u("icon",ic)}>{ic}</div>)}</div></div>
        <div className="ft-row"><div className="ft-field"><label className="ft-lbl">Belohnung</label><input className="ft-input" type="number" value={editTask.minutesReward} onChange={e=>u("minutesReward",parseInt(e.target.value)||0)} min={0}/></div><div className="ft-field"><label className="ft-lbl">Strafe</label><input className="ft-input" type="number" value={editTask.minutesPenalty} onChange={e=>u("minutesPenalty",parseInt(e.target.value)||0)} min={0}/></div><div className="ft-field"><label className="ft-lbl">Deadline</label><input className="ft-input" type="time" value={editTask.dueTime} onChange={e=>u("dueTime",e.target.value)}/></div></div>
        <div className="ft-field"><label className="ft-lbl">Wochentage</label><div className="ft-day-row">{DAYS_S.map((d,i)=><button key={i} className={`ft-day-btn ${editTask.repeatDays.includes(i)?"sel":""}`} onClick={()=>togDay(i)}>{d}</button>)}</div></div>
        <div className="ft-field"><label className="ft-lbl">Zugewiesen an</label><div className="ft-assign-row">{children.map(c=><button key={c.id} className={`ft-assign-btn ${editTask.assignedTo.includes(c.id)?"sel":""}`} style={{"--cc":c.color,"--ccr":h2r(c.color)}} onClick={()=>togAssign(c.id)}>{c.emoji} {c.name}</button>)}</div></div>
        <div className="ft-modal-acts"><button className="ft-btn ft-btn-sec" onClick={()=>setEditTask(null)}>Abbrechen</button><button className="ft-btn ft-btn-pri" onClick={()=>editTask.title.trim()&&saveTask(editTask)}>Speichern</button></div>
      </div></div>);};

      const PinModal=()=>{if(!showPin)return null;return(<div className="ft-overlay"><div className="ft-modal" style={{maxWidth:320,borderRadius:20,margin:"auto 0 0"}}><div className="ft-modal-title" style={{textAlign:"center"}}>🔐 Admin-PIN</div><div className="ft-pin-disp"><div className="ft-pin-title">PIN eingeben</div><div className="ft-pin-dots">{[0,1,2,3].map(i=><div key={i} className={`ft-pin-dot ${i<pinInput.length?"on":""}`} style={pinErr?{background:"#FF6B6B",animation:"shake 0.4s"}:{}}/>)}</div>{pinErr&&<div className="ft-pin-err">Falscher PIN!</div>}</div><div className="ft-pin-grid">{["1","2","3","4","5","6","7","8","9","⌫","0","✓"].map(d=><button key={d} className="ft-pin-btn" style={d==="⌫"?{background:"rgba(255,107,107,0.12)",color:"#FF8E8E"}:d==="✓"?{background:"rgba(107,203,119,0.12)",color:"#6BCB77"}:{}} onClick={()=>d!=="✓"&&handlePin(d)}>{d}</button>)}</div><button className="ft-btn ft-btn-sec" style={{width:"100%"}} onClick={()=>{setShowPin(false);setPinInput("");setPinErr(false);}}>Abbrechen</button></div></div>);};

      return(
        <div className="ft">
          <style>{CSS}</style>
          {(screen==="home"||screen==="admin")&&(
            <div className="ft-hdr">
              <div className="ft-hdr-left">
                <div className="ft-logo">FamTask ✨</div>
                <div id="sync-status" style={{display:'flex',alignItems:'center',gap:5,marginTop:3}}>
                  <div id="sync-light" style={{width:10,height:10,borderRadius:'50%',background:'#FFB347',boxShadow:'0 0 6px #FFB347',flexShrink:0,transition:'background 0.4s,box-shadow 0.4s'}}/>
                  <span id="sync-label" style={{fontSize:9,fontWeight:700,color:'rgba(255,255,255,0.35)',whiteSpace:'nowrap'}}>Verbinde…</span>
                </div>
              </div>
              <TimerChips/>
              <div className="ft-hdr-clock">
                <div id="dom-hdr-clock-t" className="ft-clock-time">{new Date().toLocaleTimeString("de-CH",{hour:"2-digit",minute:"2-digit",second:"2-digit"})}</div>
                <div id="dom-hdr-clock-d" className="ft-clock-date">{new Date().toLocaleDateString("de-CH",{day:"numeric",month:"short"})}</div>
              </div>
            </div>
          )}
          {screen==="home"&&<Home/>}
          {screen==="child"&&<ChildScreen/>}
          {screen==="admin"&&<AdminScreen/>}
          {editChild&&ChildModal()}
          {editTask&&TaskModal()}
          {showPin&&PinModal()}
          {timerModal&&TimerModalView()}
          {AlarmOverlay()}
          {toast&&<div className={`ft-toast ${toast.type}`}>{toast.msg}</div>}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<FamTask/>);
  </script>

  <!-- PWA Install Banner (Android/Desktop) -->
  <div id="pwa-banner">
    <span id="pwa-banner-icon">✨</span>
    <div id="pwa-banner-text">
      <div id="pwa-banner-title">FamTask installieren</div>
      <div id="pwa-banner-sub">Als App auf dem Homescreen speichern</div>
    </div>
    <button id="pwa-banner-btn">Installieren</button>
    <button id="pwa-banner-close">✕</button>
  </div>

  <!-- iOS Install Tip -->
  <div id="ios-tip">
    <div id="ios-tip-title">📲 FamTask installieren (iOS)</div>
    <div id="ios-tip-steps">
      1. Tippe auf das <strong>Teilen</strong>-Symbol 📤 unten im Safari<br/>
      2. Wähle <strong>„Zum Home-Bildschirm"</strong><br/>
      3. Tippe <strong>„Hinzufügen"</strong> — fertig!
    </div>
    <button id="ios-tip-close">Verstanden</button>
  </div>

  <script>
    // Service Worker registrieren
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(r => console.log('SW registered:', r.scope))
          .catch(e => console.log('SW error:', e));
      });
    }

    // Android/Desktop: Install Banner
    let deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      if (!localStorage.getItem('pwa-dismissed')) {
        document.getElementById('pwa-banner').classList.add('show');
      }
    });

    document.getElementById('pwa-banner-btn').addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      deferredPrompt = null;
      document.getElementById('pwa-banner').classList.remove('show');
    });

    document.getElementById('pwa-banner-close').addEventListener('click', () => {
      document.getElementById('pwa-banner').classList.remove('show');
      localStorage.setItem('pwa-dismissed', '1');
    });

    // iOS: Zeige Tipp wenn Safari + nicht installiert
    const isIos = /iphone|ipad|ipod/.test(navigator.userAgent.toLowerCase());
    const isInStandalone = window.navigator.standalone === true;
    if (isIos && !isInStandalone && !localStorage.getItem('ios-tip-dismissed')) {
      setTimeout(() => {
        document.getElementById('ios-tip').classList.add('show');
      }, 3000);
    }

    document.getElementById('ios-tip-close').addEventListener('click', () => {
      document.getElementById('ios-tip').classList.remove('show');
      localStorage.setItem('ios-tip-dismissed', '1');
    });
  </script>
</body>
</html>
