<VirtualHost *:80>
    ServerName family.ossist.net
    DocumentRoot /var/www

    # ── Statische Dateien ──
    <Directory /var/www>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    # ── API → Python-Server weiterleiten ──
    ProxyPreserveHost On
    ProxyPass        /api/ http://127.0.0.1:8081/api/
    ProxyPassReverse /api/ http://127.0.0.1:8081/api/

    # CORS für API
    <Location /api/>
        Header always set Access-Control-Allow-Origin  "*"
        Header always set Access-Control-Allow-Methods "GET, POST, OPTIONS"
        Header always set Access-Control-Allow-Headers "Content-Type"
    </Location>

    ErrorLog  ${APACHE_LOG_DIR}/famtask_error.log
    CustomLog ${APACHE_LOG_DIR}/famtask_access.log combined
</VirtualHost>
