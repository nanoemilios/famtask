    function playAlarmSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const notes = [523.25,659.25,783.99,1046.5];
        const dur=0.22, gap=0.08;
        [0,1,2].forEach(rep => {
          notes.forEach((freq,i) => {
            const t = ctx.currentTime + rep*(notes.length*(dur+gap)+0.25) + i*(dur+gap);
            const osc=ctx.createOscillator(), gain=ctx.createGain();
            osc.connect(gain); gain.connect(ctx.destination);
            osc.type="sine"; osc.frequency.value=freq;
            gain.gain.setValueAtTime(0,t);
            gain.gain.linearRampToValueAtTime(rep===0?0.55:0.42, t+0.03);
            gain.gain.setValueAtTime(rep===0?0.55:0.42, t+dur-0.04);
            gain.gain.linearRampToValueAtTime(0, t+dur);
            osc.start(t); osc.stop(t+dur+0.01);
          });
        });
      } catch(e){}
    }

      .ft-pin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:9px}
      .ft-pin-btn{padding:14px;background:rgba(255,255,255,0.07);border:1.5px solid rgba(255,255,255,0.09);border-radius:12px;color:#fff;font-family:'Fredoka One',sans-serif;font-size:21px;cursor:pointer;text-align:center}
      .ft-pin-btn:active{transform:scale(0.91)}
      @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

      .ft-set-title{font-size:13px;font-weight:800;color:#fff;margin-bottom:10px}
      .ft-set-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px}
      .ft-warn-btn{width:100%;padding:10px;background:rgba(255,107,107,0.09);border:1.5px solid rgba(255,107,107,0.28);border-radius:10px;color:#FF6B6B;font-family:'Nunito',sans-serif;font-size:12px;font-weight:800;cursor:pointer;text-align:center;margin-top:7px}
      .ft-toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#2A2B3D;border-radius:50px;padding:9px 18px;font-size:12px;font-weight:800;color:#fff;z-index:200;box-shadow:0 5px 18px rgba(0,0,0,0.45);white-space:nowrap;animation:toastIn 0.22s ease}
      .ft-toast.ok{background:linear-gradient(135deg,#27AE60,#2ECC71)}
      .ft-toast.err{background:linear-gradient(135deg,#C0392B,#E74C3C)}
      .ft-toast.inf{background:linear-gradient(135deg,#1A5276,#2980B9)}
      @keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(12px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
      .ft-empty{text-align:center;padding:30px 16px;color:rgba(255,255,255,0.22);font-size:12px;font-weight:700}
    `;

    function FamTask() {
      const [screen,setScreen]=useState("home");
      const [childTab,setChildTab]=useState("tasks");
      const [adminTab,setAdminTab]=useState("children");
      const [selCid,setSelCid]=useState(null);
      const [children,setChildren]=useState(DEFAULT_CHILDREN);
      const [tasks,setTasks]=useState(DEFAULT_TASKS);
      const [comps,setComps]=useState({});
      const [mediaU,setMediaU]=useState({});
      const [timers,setTimers]=useState({});
      const [alarms,setAlarms]=useState([]);
      const [timerModal,setTimerModal]=useState(null);
      const [custMin,setCustMin]=useState("");
      const [custSec,setCustSec]=useState("");
      const firedRef=useRef({});
      const [adminPin,setAdminPin]=useState("1234");
      const [pinInput,setPinInput]=useState("");
      const [pinErr,setPinErr]=useState(false);
      const [showPin,setShowPin]=useState(false);
      const [adminOpen,setAdminOpen]=useState(false);
      const [editChild,setEditChild]=useState(null);
      const [editTask,setEditTask]=useState(null);
      const [calOffset,setCalOffset]=useState(0);
      const [calDay,setCalDay]=useState(todayStr());
      const [newPin1,setNewPin1]=useState("");
      const [newPin2,setNewPin2]=useState("");
      const [pinMsg,setPinMsg]=useState("");
      const [now,setNow]=useState(new Date());
      const [loaded,setLoaded]=useState(false);
      const [toast,setToast]=useState(null);

      const showToast=(msg,type="ok")=>{setToast({msg,type});setTimeout(()=>setToast(null),2400);};
      useEffect(()=>{const t=setInterval(()=>setNow(new Date()),1000);return()=>clearInterval(t);},[]);
      useEffect(()=>{
        const ms=Date.now();
        Object.entries(timers).forEach(([cid,tmr])=>{
          if(!tmr)return;
          if(tmr.endsAt<=ms&&!firedRef.current[cid]){firedRef.current[cid]=true;playAlarmSound();setAlarms(a=>a.includes(cid)?a:[...a,cid]);}
        });
      },[now,timers]);

      useEffect(()=>{
        try{
          const r1=storage.get("ft-ch"),r2=storage.get("ft-ta"),r3=storage.get("ft-co"),r4=storage.get("ft-mu"),r5=storage.get("ft-pin"),r6=storage.get("ft-timers");
          if(r1)setChildren(JSON.parse(r1.value));
          if(r2)setTasks(JSON.parse(r2.value));
          if(r3)setComps(JSON.parse(r3.value));
          if(r4)setMediaU(JSON.parse(r4.value));
          if(r5)setAdminPin(r5.value);
          if(r6)setTimers(JSON.parse(r6.value));
        }catch(e){}
        setLoaded(true);
      },[]);

      const sv=(k,v)=>{try{storage.set(k,JSON.stringify(v));}catch(e){}};
      useEffect(()=>{if(loaded)sv("ft-ch",children);},[children,loaded]);
      useEffect(()=>{if(loaded)sv("ft-ta",tasks);},[tasks,loaded]);
      useEffect(()=>{if(loaded)sv("ft-co",comps);},[comps,loaded]);
      useEffect(()=>{if(loaded)sv("ft-mu",mediaU);},[mediaU,loaded]);
      useEffect(()=>{if(loaded)sv("ft-timers",timers);},[timers,loaded]);
      useEffect(()=>{if(loaded)try{storage.set("ft-pin",adminPin);}catch(e){};},[adminPin,loaded]);

      useEffect(()=>{
        if(!loaded)return;
        const d=todayStr(),n=new Date(),nowMin=n.getHours()*60+n.getMinutes(),dow=n.getDay();
        let nc={...comps},nch=[...children],changed=false;
        tasks.forEach(task=>{
          if(!task.repeatDays.includes(dow))return;
          const[dh,dm]=task.dueTime.split(":").map(Number);if(nowMin<dh*60+dm)return;
          task.assignedTo.forEach(cid=>{const key=`${cid}_${task.id}_${d}`,ex=nc[key];
            if(!ex?.completed&&!ex?.penaltyApplied){nc[key]={completed:false,penaltyApplied:true};const ci=nch.findIndex(c=>c.id===cid);if(ci>=0){nch[ci]={...nch[ci],earnedMinutes:Math.max(0,nch[ci].earnedMinutes-task.minutesPenalty)};changed=true;}}
          });
        });
        if(changed){setChildren(nch);setComps(nc);}
      },[loaded]);

      const startTimer=(cid,secs)=>{setTimers(p=>({...p,[cid]:{endsAt:Date.now()+secs*1000,totalSecs:secs}}));delete firedRef.current[cid];setAlarms(a=>a.filter(x=>x!==cid));showToast("⏱ Timer gestartet!","inf");};
      const stopTimer=cid=>{setTimers(p=>({...p,[cid]:null}));delete firedRef.current[cid];setAlarms(a=>a.filter(x=>x!==cid));};
      const dismissAlarm=cid=>{setAlarms(a=>a.filter(x=>x!==cid));setTimers(p=>({...p,[cid]:null}));};
      const getTimerSecs=cid=>{const t=timers[cid];if(!t)return null;return Math.max(0,Math.round((t.endsAt-Date.now())/1000));};
      const getTimerPct=cid=>{const t=timers[cid];if(!t||!t.totalSecs)return 0;const s=getTimerSecs(cid);return Math.min(100,(s/t.totalSecs)*100);};
      const getChild=id=>children.find(c=>c.id===id);
      const getByDow=(c,d)=>tasks.filter(t=>t.assignedTo.includes(c)&&t.repeatDays.includes(d)).sort((a,b)=>a.dueTime.localeCompare(b.dueTime));
      const getTodayTasks=cid=>getByDow(cid,now.getDay());
      const isDone=(c,t,d=todayStr())=>comps[`${c}_${t}_${d}`]?.completed||false;
      const isMissed=(c,t,d=todayStr())=>{const x=comps[`${c}_${t}_${d}`];return x&&!x.completed&&x.penaltyApplied;};
      const getMediaUsed=(c,t)=>mediaU[`${c}_${t}_${todayStr()}`]||0;
      const toggleTask=(cid,tid)=>{const d=todayStr(),key=`${cid}_${tid}_${d}`,ex=comps[key],task=tasks.find(t=>t.id===tid);if(!task||ex?.penaltyApplied)return;if(ex?.completed){setComps(p=>({...p,[key]:{completed:false,penaltyApplied:false}}));setChildren(p=>p.map(c=>c.id===cid?{...c,earnedMinutes:Math.max(0,c.earnedMinutes-task.minutesReward)}:c));showToast("Rückgängig","inf");}else{setComps(p=>({...p,[key]:{completed:true,penaltyApplied:false}}));setChildren(p=>p.map(c=>c.id===cid?{...c,earnedMinutes:c.earnedMinutes+task.minutesReward}:c));showToast(`🎉 +${task.minutesReward} Min verdient!`);}};
      const useMedia=(cid,type,mins)=>{const ch=getChild(cid);if(!ch||ch.earnedMinutes<mins){showToast("Nicht genug Minuten! ⏰","err");return;}const used=getMediaUsed(cid,type);if(used+mins>ch.mediaLimits[type]){showToast("Tageslimit erreicht! 🚫","err");return;}setMediaU(p=>({...p,[`${cid}_${type}_${todayStr()}`]:used+mins}));setChildren(p=>p.map(c=>c.id===cid?{...c,earnedMinutes:c.earnedMinutes-mins}:c));showToast(`✅ ${mins} Min freigeschaltet!`);};
      const getNextDL=cid=>{const tt=getTodayTasks(cid),nowMin=now.getHours()*60+now.getMinutes(),d=todayStr();for(const t of tt){if(comps[`${cid}_${t.id}_${d}`]?.completed)continue;const[h,m]=t.dueTime.split(":").map(Number),tMin=h*60+m;if(tMin>nowMin)return{task:t,secsLeft:(tMin-nowMin)*60-now.getSeconds()};}return null;};
      const fmtClock=d=>d.toLocaleTimeString("de-CH",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
      const fmtShort=d=>d.toLocaleTimeString("de-CH",{hour:"2-digit",minute:"2-digit"});
      const fmtCd=s=>{if(s<=0)return"00:00:00";return[Math.floor(s/3600),Math.floor((s%3600)/60),s%60].map(v=>String(v).padStart(2,"0")).join(":");};
      const getWeekDates=(off=0)=>{const d=new Date(),dow=d.getDay(),mon=new Date(d);mon.setDate(d.getDate()-(dow===0?6:dow-1)+off*7);return Array.from({length:7},(_,i)=>{const x=new Date(mon);x.setDate(mon.getDate()+i);return x;});};
      const handlePin=digit=>{if(digit==="⌫"){setPinInput(p=>p.slice(0,-1));setPinErr(false);return;}const next=pinInput+digit;setPinInput(next);if(next.length===4){if(next===adminPin){setAdminOpen(true);setShowPin(false);setPinInput("");setPinErr(false);setScreen("admin");}else{setPinErr(true);setTimeout(()=>{setPinInput("");setPinErr(false);},700);}}};
      const saveChild=c=>{if(c.id)setChildren(p=>p.map(x=>x.id===c.id?c:x));else setChildren(p=>[...p,{...c,id:uid(),earnedMinutes:c.earnedMinutes||0}]);setEditChild(null);showToast("Gespeichert ✓");};
      const delChild=id=>{setChildren(p=>p.filter(c=>c.id!==id));setTasks(p=>p.map(t=>({...t,assignedTo:t.assignedTo.filter(x=>x!==id)})));showToast("Gelöscht","inf");};
      const saveTask=t=>{if(t.id)setTasks(p=>p.map(x=>x.id===t.id?t:x));else setTasks(p=>[...p,{...t,id:uid()}]);setEditTask(null);showToast("Gespeichert ✓");};
      const delTask=id=>{setTasks(p=>p.filter(t=>t.id!==id));showToast("Gelöscht","inf");};
      const selChild=getChild(selCid);
      const nextDL=selCid?getNextDL(selCid):null;

      const TimerChips=()=>(
        <div className="ft-hdr-timers">
          {children.map(c=>{const secs=getTimerSecs(c.id),running=secs!==null&&secs>0,expired=secs!==null&&secs===0,urgent=running&&secs<=60;
            return(<div key={c.id} className={`ft-tchip ${running?"running":""} ${urgent?"urgent":""} ${expired?"expired":""}`} style={{"--tc":c.color,"--tcr":h2r(c.color)}} onClick={()=>{setTimerModal(c.id);setCustMin("");setCustSec("");}}>
              <div className="ft-tchip-row"><span className="ft-tchip-emoji">{c.emoji}</span><span className="ft-tchip-name">{c.name.slice(0,5)}</span></div>
              <span className="ft-tchip-val">{running?fmtMM(secs):expired?"✓":"⏱"}</span>
            </div>);
          })}
        </div>
      );

      const TimerModalView=()=>{if(!timerModal)return null;const c=getChild(timerModal);if(!c)return null;const secs=getTimerSecs(c.id),running=secs!==null&&secs>0,expired=secs!==null&&secs===0,urgent=running&&secs<=60,pct=getTimerPct(c.id);
        return(<div className="ft-overlay" onClick={e=>e.target===e.currentTarget&&setTimerModal(null)}>
          <div className="ft-tmodal">
            <div className="ft-tmod-badge"><span className="ft-tmod-emoji">{c.emoji}</span><div><div className="ft-tmod-name">{c.name}</div><div className="ft-tmod-status">{running?"Timer läuft…":expired?"Zeit abgelaufen!":"Kein Timer aktiv"}</div></div></div>
            {(running||expired)&&<div className="ft-tmod-active"><div className="ft-tmod-active-lbl">{expired?"ABGELAUFEN":"Verbleibende Zeit"}</div><div className={`ft-tmod-active-val ${urgent?"urgent":""}`}>{fmtMM(secs||0)}</div>{running&&<div className="ft-tmod-bar-bg"><div className="ft-tmod-bar-fill" style={{width:`${pct}%`}}/></div>}</div>}
            {running&&<button className="ft-stop-btn" onClick={()=>{stopTimer(c.id);showToast("Timer gestoppt","inf");}}>⏹ Timer stoppen</button>}
            <div className="ft-preset-lbl">Schnellstart</div>
            <div className="ft-presets">{TIMER_PRESETS.map(p=><button key={p.secs} className="ft-preset-btn" onClick={()=>{startTimer(c.id,p.secs);setTimerModal(null);}}>{p.label}</button>)}</div>
            <div className="ft-preset-lbl">Eigene Zeit</div>
            <div className="ft-custom-row">
              <div className="ft-field"><label className="ft-lbl">Min</label><input className="ft-input" type="number" min="0" placeholder="0" value={custMin} onChange={e=>setCustMin(e.target.value)} inputMode="numeric"/></div>
              <div className="ft-field"><label className="ft-lbl">Sek</label><input className="ft-input" type="number" min="0" max="59" placeholder="0" value={custSec} onChange={e=>setCustSec(e.target.value)} inputMode="numeric"/></div>
              <button className="ft-custom-start" onClick={()=>{const total=(parseInt(custMin)||0)*60+(parseInt(custSec)||0);if(total>0){startTimer(c.id,total);setTimerModal(null);}}}>Start</button>
            </div>
            <button className="ft-btn ft-btn-sec" style={{width:"100%"}} onClick={()=>setTimerModal(null)}>Schließen</button>
          </div>
        </div>);
      };

      const AlarmOverlay=()=>{if(!alarms.length)return null;const cid=alarms[0],c=getChild(cid);if(!c)return null;
        return(<div className="ft-alarm"><div className="ft-alarm-glow" style={{"--ar":h2r(c.color)}}/><div className="ft-alarm-emoji">⏰</div><div className="ft-alarm-name">{c.name}</div><div className="ft-alarm-sub">Dein Timer ist abgelaufen!</div><button className="ft-alarm-btn" onClick={()=>dismissAlarm(cid)}>OK — Stopp!</button></div>);
      };

      const Home=()=>(<div className="ft-home"><div className="ft-sec-title">Wer bist du?</div><div className="ft-grid">{children.map(c=>{const tt=getTodayTasks(c.id),done=tt.filter(t=>isDone(c.id,t.id)).length;return(<div key={c.id} className="ft-child-card" style={{"--col":c.color,"--cold":darken(c.color,50)}} onClick={()=>{setSelCid(c.id);setChildTab("tasks");setCalDay(todayStr());setScreen("child");}}><span className="ft-child-emoji">{c.emoji}</span><div className="ft-child-name">{c.name}</div><div className="ft-child-badge">⏱️ {c.earnedMinutes} Min</div><div className="ft-child-prog">{done}/{tt.length} Aufgaben heute</div></div>);})}</div><button className="ft-admin-btn" onClick={()=>adminOpen?setScreen("admin"):setShowPin(true)}>⚙️ Admin-Bereich</button></div>);

      const TasksTab=()=>{if(!selChild)return null;const tt=getTodayTasks(selChild.id);if(!tt.length)return<div className="ft-empty"><div style={{fontSize:40,marginBottom:9}}>🎉</div>Heute keine Aufgaben!</div>;return(<>{tt.map(task=>{const done=isDone(selChild.id,task.id),missed=isMissed(selChild.id,task.id);return(<div key={task.id} className={`ft-task ${done?"done":""} ${missed?"missed":""}`} onClick={()=>toggleTask(selChild.id,task.id)}><div className="ft-task-cb">{done?"✓":""}</div><span className="ft-task-ic">{task.icon}</span><div className="ft-task-info"><div className="ft-task-title">{task.title}</div><div className="ft-task-due">Bis {task.dueTime} Uhr</div>{missed&&<div className="ft-task-pen">-{task.minutesPenalty} Min — verpasst!</div>}</div><div className="ft-task-reward">{done?<span style={{fontSize:19}}>⭐</span>:<><div className="ft-task-rval">+{task.minutesReward}'</div><div className="ft-task-rsub">-{task.minutesPenalty}' Strafe</div></>}</div></div>);})}</>);};

      const MediaTab=()=>{if(!selChild)return null;return(<><div className="ft-media-hero"><div className="ft-media-hero-lbl">Verdiente Minuten</div><div className="ft-media-hero-val">{selChild.earnedMinutes}</div><div className="ft-media-hero-sub">Minuten zum Einlösen</div></div>{MEDIA.map(m=>{const used=getMediaUsed(selChild.id,m.id),lim=selChild.mediaLimits[m.id],rem=lim-used,pct=Math.min(100,(used/lim)*100);return(<div key={m.id} className="ft-mcard" style={{background:m.bg}}><div className="ft-mcard-hdr"><span className="ft-mcard-icon">{m.icon}</span><div><div className="ft-mcard-title">{m.label}</div><div className="ft-mcard-sub">{rem} von {lim} Min übrig</div></div></div><div className="ft-mprog-bg"><div className="ft-mprog-fill" style={{width:`${pct}%`,background:m.color}}/></div><div className="ft-mstats"><span>Verbraucht: {used} Min</span><span>Limit: {lim} Min</span></div><div className="ft-mbtns">{[15,30,60].map(mins=>{const ok=selChild.earnedMinutes>=mins&&rem>=mins;return<button key={mins} className={`ft-mbtn ${!ok?"dis":""}`} onClick={()=>ok&&useMedia(selChild.id,m.id,mins)}>{mins} Min</button>;})}</div></div>);})}</>);};

      const CalendarTab=()=>{if(!selChild)return null;const wd=getWeekDates(calOffset),td=todayStr(),selDate=new Date(calDay+"T00:00:00"),selTasks=getByDow(selChild.id,selDate.getDay()),weekLbl=calOffset===0?"Diese Woche":calOffset===-1?"Letzte Woche":calOffset===1?"Nächste Woche":`${calOffset>0?"+":""}${calOffset} Wochen`;return(<><div className="ft-week-nav"><button className="ft-week-btn" onClick={()=>setCalOffset(o=>o-1)}>‹</button><div className="ft-week-lbl">{weekLbl}</div><button className="ft-week-btn" onClick={()=>setCalOffset(o=>o+1)}>›</button></div><div className="ft-days-row">{wd.map((date,i)=>{const ds=getDs(date),isToday=ds===td,isSel=ds===calDay,dtasks=getByDow(selChild.id,date.getDay()),doneCnt=dtasks.filter(t=>isDone(selChild.id,t.id,ds)).length,missedCnt=dtasks.filter(t=>isMissed(selChild.id,t.id,ds)).length;return(<div key={i} className={`ft-day ${isToday?"today":""} ${isSel?"sel":""}`} style={isSel?{background:selChild.color}:{}} onClick={()=>setCalDay(ds)}><div className="ft-day-lbl">{DAYS_S[date.getDay()]}</div><div className="ft-day-num">{date.getDate()}</div><div className="ft-day-dots">{Array.from({length:Math.min(doneCnt,3)},(_,j)=><div key={"g"+j} className="ft-dot" style={{background:"#6BCB77"}}/>)}{Array.from({length:Math.min(missedCnt,3)},(_,j)=><div key={"r"+j} className="ft-dot" style={{background:"#FF6B6B"}}/>)}</div></div>);})}</div><div className="ft-cal-day-title">{selDate.toLocaleDateString("de-CH",{weekday:"long",day:"numeric",month:"long"})}</div>{selTasks.length===0?<div className="ft-empty">Keine Aufgaben an diesem Tag</div>:selTasks.map(t=>{const done=isDone(selChild.id,t.id,calDay),missed=isMissed(selChild.id,t.id,calDay);return(<div key={t.id} className="ft-cal-task"><span className="ft-cal-ic">{t.icon}</span><div className="ft-cal-info"><div className="ft-cal-title">{t.title}</div><div className="ft-cal-due">bis {t.dueTime} Uhr · +{t.minutesReward} Min</div></div><span className="ft-cal-status">{done?"✅":missed?"❌":"⏳"}</span></div>);})}</>);};

      const ChildScreen=()=>{if(!selChild)return null;const tt=getTodayTasks(selChild.id),done=tt.filter(t=>isDone(selChild.id,t.id)).length,pct=tt.length?(done/tt.length)*100:0,secs=getTimerSecs(selChild.id),timerOn=secs!==null&&secs>0,timerUrgent=timerOn&&secs<=60;
        return(<div className="ft-child-screen" style={{"--cc":selChild.color,"--ccd":darken(selChild.color,55)}}><div className="ft-child-hdr"><div className="ft-child-hdr-top"><button className="ft-back" onClick={()=>setScreen("home")}>←</button><span style={{fontSize:26}}>{selChild.emoji}</span><div className="ft-child-hdr-name">{selChild.name}</div><div className="ft-ctimer-pill" onClick={()=>{setTimerModal(selChild.id);setCustMin("");setCustSec("");}}><span className="ft-ctimer-lbl">TIMER</span><span className={`ft-ctimer-val ${timerOn?(timerUrgent?"urgent":"on"):""}`}>{timerOn?fmtMM(secs):secs===0?"✓":"⏱"}</span></div><div className="ft-clock-sm"><div className="ft-clock-sm-t">{fmtShort(now)}</div><div className="ft-clock-sm-d">{now.toLocaleDateString("de-CH",{day:"numeric",month:"short"})}</div></div></div><div className="ft-mins-box"><div><div className="ft-mins-lbl">Verdiente Minuten</div><div className="ft-mins-val">{selChild.earnedMinutes}</div><div className="ft-mins-sub">Gesamt angespart</div></div><div style={{textAlign:"right"}}><div className="ft-mins-lbl">Heute</div><div style={{fontFamily:"'Fredoka One',sans-serif",fontSize:28,color:"#fff"}}>{done}/{tt.length}</div><div className="ft-mins-sub">Aufgaben</div></div></div><div className="ft-progress-bar"><div className="ft-progress-fill" style={{width:`${pct}%`}}/></div>{nextDL&&<div className="ft-countdown"><div><div className="ft-countdown-lbl">Nächste Aufgabe</div><div className="ft-countdown-task">{nextDL.task.icon} {nextDL.task.title}</div></div><div><div className="ft-countdown-sub">Noch</div><div className="ft-countdown-val">{fmtCd(nextDL.secsLeft)}</div></div></div>}</div><div className="ft-content">{childTab==="tasks"&&<TasksTab/>}{childTab==="media"&&<MediaTab/>}{childTab==="calendar"&&<CalendarTab/>}</div><div className="ft-bnav">{[{id:"tasks",icon:"✅",lbl:"Aufgaben"},{id:"calendar",icon:"📅",lbl:"Kalender"},{id:"media",icon:"🎮",lbl:"Medienzeit"}].map(n=>(<div key={n.id} className={`ft-nav-it ${childTab===n.id?"active":""}`} onClick={()=>setChildTab(n.id)}><span className="ft-nav-icon">{n.icon}</span><span className="ft-nav-lbl">{n.lbl}</span></div>))}</div></div>);
      };

      const AdminChildren=()=>(<div>{children.map(c=>(<div key={c.id} className="ft-aitem"><div style={{width:34,height:34,borderRadius:10,background:c.color,display:"flex",alignItems:"center",justifyContent:"center",fontSize:18,flexShrink:0}}>{c.emoji}</div><div className="ft-aitem-info"><div className="ft-aitem-title">{c.name}</div><div className="ft-aitem-sub">📺 {c.mediaLimits.tv}' · 📱 {c.mediaLimits.tablet}' · 🎮 {c.mediaLimits.nintendo}' | ⏱️ {c.earnedMinutes} Min</div></div><div className="ft-aitem-actions"><button className="ft-ic-btn" onClick={()=>setEditChild({...c})}>✏️</button><button className="ft-ic-btn del" onClick={()=>delChild(c.id)}>🗑️</button></div></div>))}<button className="ft-add-btn" onClick={()=>setEditChild({name:"",color:COLORS[0],emoji:EMOJIS[0],earnedMinutes:0,mediaLimits:{tv:60,tablet:60,nintendo:60}})}>+ Kind hinzufügen</button></div>);
      const AdminTasks=()=>(<div>{tasks.map(t=>{const names=children.filter(c=>t.assignedTo.includes(c.id)).map(c=>c.name).join(", ")||"niemand";return(<div key={t.id} className="ft-aitem"><div style={{fontSize:24,flexShrink:0}}>{t.icon}</div><div className="ft-aitem-info"><div className="ft-aitem-title">{t.title}</div><div className="ft-aitem-sub">+{t.minutesReward}' / -{t.minutesPenalty}' · {t.dueTime} · {names}</div></div><div className="ft-aitem-actions"><button className="ft-ic-btn" onClick={()=>setEditTask({...t})}>✏️</button><button className="ft-ic-btn del" onClick={()=>delTask(t.id)}>🗑️</button></div></div>);})}<button className="ft-add-btn" onClick={()=>setEditTask({title:"",icon:"📚",assignedTo:[],minutesReward:10,minutesPenalty:5,dueTime:"18:00",repeatDays:[1,2,3,4,5]})}>+ Aufgabe hinzufügen</button></div>);

      const AdminSettings=()=>(<div><div className="ft-set-card"><div className="ft-set-title">🔐 Admin-PIN ändern</div><div className="ft-field"><input className="ft-input" type="password" placeholder="Neuer PIN (4 Ziffern)" maxLength={4} value={newPin1} onChange={e=>setNewPin1(e.target.value)} inputMode="numeric"/></div><div className="ft-field"><input className="ft-input" type="password" placeholder="PIN bestätigen" maxLength={4} value={newPin2} onChange={e=>setNewPin2(e.target.value)} inputMode="numeric"/></div>{pinMsg&&<div style={{color:pinMsg.includes("✅")?"#6BCB77":"#FF6B6B",fontWeight:700,fontSize:11,marginBottom:8}}>{pinMsg}</div>}<button className="ft-btn ft-btn-pri" style={{width:"100%"}} onClick={()=>{if(!/^\d{4}$/.test(newPin1)){setPinMsg("PIN muss 4 Ziffern sein");return;}if(newPin1!==newPin2){setPinMsg("PINs stimmen nicht überein");return;}setAdminPin(newPin1);setNewPin1("");setNewPin2("");setPinMsg("✅ PIN geändert!");setTimeout(()=>setPinMsg(""),2000);}}>PIN speichern</button></div>{children.map(c=>(<div key={c.id} className="ft-set-card"><div className="ft-set-title">{c.emoji} {c.name}</div>{MEDIA.map(m=>{const used=getMediaUsed(c.id,m.id),lim=c.mediaLimits[m.id];return<div key={m.id} className="ft-set-row"><span style={{fontSize:11,color:"rgba(255,255,255,0.55)",fontWeight:700}}>{m.icon} {m.label}</span><span style={{fontSize:11,color:"rgba(255,255,255,0.38)",fontWeight:700}}>{used}/{lim} Min</span></div>;})}<button className="ft-warn-btn" onClick={()=>{const d=todayStr();setMediaU(p=>{const n={...p};["tv","tablet","nintendo"].forEach(t=>{delete n[`${c.id}_${t}_${d}`];});return n;});showToast(`Medien für ${c.name} zurückgesetzt`,"inf");}}>Medienkonsum zurücksetzen</button><button className="ft-warn-btn" style={{marginTop:5,borderColor:"rgba(255,165,0,0.3)",color:"#FFB347",background:"rgba(255,165,0,0.07)"}} onClick={()=>{setChildren(p=>p.map(x=>x.id===c.id?{...x,earnedMinutes:0}:x));showToast(`Minuten für ${c.name} zurückgesetzt`,"inf");}}>Verdiente Minuten auf 0</button></div>))}</div>);

      const AdminScreen=()=>(<div className="ft-admin"><div className="ft-admin-hdr"><button className="ft-back" style={{background:"rgba(255,255,255,0.07)"}} onClick={()=>setScreen("home")}>←</button><div className="ft-admin-title">⚙️ Admin</div></div><div className="ft-tabs">{[{id:"children",lbl:"👨‍👩‍👧 Kinder"},{id:"tasks",lbl:"📋 Aufgaben"},{id:"settings",lbl:"⚙️ Einstellungen"}].map(t=><button key={t.id} className={`ft-tab ${adminTab===t.id?"active":""}`} onClick={()=>setAdminTab(t.id)}>{t.lbl}</button>)}</div><div className="ft-admin-body">{adminTab==="children"&&<AdminChildren/>}{adminTab==="tasks"&&<AdminTasks/>}{adminTab==="settings"&&<AdminSettings/>}</div></div>);

      const ChildModal=()=>{if(!editChild)return null;const isNew=!editChild.id,u=(k,v)=>setEditChild(p=>({...p,[k]:v})),ul=(k,v)=>setEditChild(p=>({...p,mediaLimits:{...p.mediaLimits,[k]:parseInt(v)||0}}));return(<div className="ft-overlay" onClick={e=>e.target===e.currentTarget&&setEditChild(null)}><div className="ft-modal"><div className="ft-modal-title">{isNew?"Kind hinzufügen":"Kind bearbeiten"}</div><div className="ft-field"><label className="ft-lbl">Name</label><input className="ft-input" value={editChild.name} onChange={e=>u("name",e.target.value)} placeholder="Name"/></div><div className="ft-field"><label className="ft-lbl">Emoji</label><div className="ft-emoji-grid">{EMOJIS.map(e=><div key={e} className={`ft-emoji-opt ${editChild.emoji===e?"sel":""}`} onClick={()=>u("emoji",e)}>{e}</div>)}</div></div><div className="ft-field"><label className="ft-lbl">Farbe</label><div className="ft-col-grid">{COLORS.map(c=><div key={c} className={`ft-col-sw ${editChild.color===c?"sel":""}`} style={{background:c}} onClick={()=>u("color",c)}/>)}</div></div><div className="ft-field"><label className="ft-lbl">Medienlimits/Tag (Min)</label><div className="ft-row">{MEDIA.map(m=><div key={m.id} className="ft-field"><label className="ft-lbl">{m.icon} {m.label}</label><input className="ft-input" type="number" value={editChild.mediaLimits[m.id]} onChange={e=>ul(m.id,e.target.value)} min={0}/></div>)}</div></div>{isNew&&<div className="ft-field"><label className="ft-lbl">Startminuten</label><input className="ft-input" type="number" value={editChild.earnedMinutes} onChange={e=>u("earnedMinutes",parseInt(e.target.value)||0)} min={0}/></div>}<div className="ft-modal-acts"><button className="ft-btn ft-btn-sec" onClick={()=>setEditChild(null)}>Abbrechen</button><button className="ft-btn ft-btn-pri" onClick={()=>editChild.name.trim()&&saveChild(editChild)}>Speichern</button></div></div></div>);};

      const TaskModal=()=>{if(!editTask)return null;const isNew=!editTask.id,u=(k,v)=>setEditTask(p=>({...p,[k]:v})),togDay=d=>u("repeatDays",editTask.repeatDays.includes(d)?editTask.repeatDays.filter(x=>x!==d):[...editTask.repeatDays,d]),togAssign=cid=>u("assignedTo",editTask.assignedTo.includes(cid)?editTask.assignedTo.filter(x=>x!==cid):[...editTask.assignedTo,cid]);return(<div className="ft-overlay" onClick={e=>e.target===e.currentTarget&&setEditTask(null)}><div className="ft-modal"><div className="ft-modal-title">{isNew?"Aufgabe hinzufügen":"Aufgabe bearbeiten"}</div><div className="ft-field"><label className="ft-lbl">Titel</label><input className="ft-input" value={editTask.title} onChange={e=>u("title",e.target.value)} placeholder="z.B. Zimmer aufräumen"/></div><div className="ft-field"><label className="ft-lbl">Icon</label><div className="ft-emoji-grid">{TASK_ICONS.map(ic=><div key={ic} className={`ft-emoji-opt ${editTask.icon===ic?"sel":""}`} onClick={()=>u("icon",ic)}>{ic}</div>)}</div></div><div className="ft-row"><div className="ft-field"><label className="ft-lbl">Belohnung</label><input className="ft-input" type="number" value={editTask.minutesReward} onChange={e=>u("minutesReward",parseInt(e.target.value)||0)} min={0}/></div><div className="ft-field"><label className="ft-lbl">Strafe</label><input className="ft-input" type="number" value={editTask.minutesPenalty} onChange={e=>u("minutesPenalty",parseInt(e.target.value)||0)} min={0}/></div><div className="ft-field"><label className="ft-lbl">Deadline</label><input className="ft-input" type="time" value={editTask.dueTime} onChange={e=>u("dueTime",e.target.value)}/></div></div><div className="ft-field"><label className="ft-lbl">Wochentage</label><div className="ft-day-row">{DAYS_S.map((d,i)=><button key={i} className={`ft-day-btn ${editTask.repeatDays.includes(i)?"sel":""}`} onClick={()=>togDay(i)}>{d}</button>)}</div></div><div className="ft-field"><label className="ft-lbl">Zugewiesen an</label><div className="ft-assign-row">{children.map(c=><button key={c.id} className={`ft-assign-btn ${editTask.assignedTo.includes(c.id)?"sel":""}`} style={{"--cc":c.color,"--ccr":h2r(c.color)}} onClick={()=>togAssign(c.id)}>{c.emoji} {c.name}</button>)}</div></div><div className="ft-modal-acts"><button className="ft-btn ft-btn-sec" onClick={()=>setEditTask(null)}>Abbrechen</button><button className="ft-btn ft-btn-pri" onClick={()=>editTask.title.trim()&&saveTask(editTask)}>Speichern</button></div></div></div>);};

      const PinModal=()=>{if(!showPin)return null;return(<div className="ft-overlay"><div className="ft-modal" style={{maxWidth:320,borderRadius:20,margin:"auto 0 0"}}><div className="ft-modal-title" style={{textAlign:"center"}}>🔐 Admin-PIN</div><div className="ft-pin-disp"><div className="ft-pin-title">PIN eingeben</div><div className="ft-pin-dots">{[0,1,2,3].map(i=><div key={i} className={`ft-pin-dot ${i<pinInput.length?"on":""}`} style={pinErr?{background:"#FF6B6B",animation:"shake 0.4s"}:{}}/>)}</div>{pinErr&&<div className="ft-pin-err">Falscher PIN!</div>}</div><div className="ft-pin-grid">{["1","2","3","4","5","6","7","8","9","⌫","0","✓"].map(d=><button key={d} className="ft-pin-btn" style={d==="⌫"?{background:"rgba(255,107,107,0.12)",color:"#FF8E8E"}:d==="✓"?{background:"rgba(107,203,119,0.12)",color:"#6BCB77"}:{}} onClick={()=>d!=="✓"&&handlePin(d)}>{d}</button>)}</div><button className="ft-btn ft-btn-sec" style={{width:"100%"}} onClick={()=>{setShowPin(false);setPinInput("");setPinErr(false);}}>Abbrechen</button></div></div>);};

      return(
        <div className="ft">
          <style>{CSS}</style>
          {(screen==="home"||screen==="admin")&&(
            <div className="ft-hdr">
              <div className="ft-hdr-left"><div className="ft-logo">FamTask ✨</div></div>
              <TimerChips/>
              <div className="ft-hdr-clock">
                <div className="ft-clock-time">{fmtClock(now)}</div>
                <div className="ft-clock-date">{now.toLocaleDateString("de-CH",{day:"numeric",month:"short"})}</div>
              </div>
            </div>
          )}
          {screen==="home"&&<Home/>}
          {screen==="child"&&<ChildScreen/>}
          {screen==="admin"&&<AdminScreen/>}
          {editChild&&<ChildModal/>}
          {editTask&&<TaskModal/>}
          {showPin&&<PinModal/>}
          {timerModal&&<TimerModalView/>}
          <AlarmOverlay/>
          {toast&&<div className={`ft-toast ${toast.type}`}>{toast.msg}</div>}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<FamTask/>);
  </script>

  <!-- PWA Install Banner (Android/Desktop) -->
  <div id="pwa-banner">
    <span id="pwa-banner-icon">✨</span>
    <div id="pwa-banner-text">
      <div id="pwa-banner-title">FamTask installieren</div>
      <div id="pwa-banner-sub">Als App auf dem Homescreen speichern</div>
    </div>
    <button id="pwa-banner-btn">Installieren</button>
    <button id="pwa-banner-close">✕</button>
  </div>

  <!-- iOS Install Tip -->
  <div id="ios-tip">
    <div id="ios-tip-title">📲 FamTask installieren (iOS)</div>
    <div id="ios-tip-steps">
      1. Tippe auf das <strong>Teilen</strong>-Symbol 📤 unten im Safari<br/>
      2. Wähle <strong>„Zum Home-Bildschirm"</strong><br/>
      3. Tippe <strong>„Hinzufügen"</strong> — fertig!
    </div>
    <button id="ios-tip-close">Verstanden</button>
  </div>

  <script>
    // Service Worker registrieren
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(r => console.log('SW registered:', r.scope))
          .catch(e => console.log('SW error:', e));
      });
    }

    // Android/Desktop: Install Banner
    let deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      if (!localStorage.getItem('pwa-dismissed')) {
        document.getElementById('pwa-banner').classList.add('show');
      }
    });

    document.getElementById('pwa-banner-btn').addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      deferredPrompt = null;
      document.getElementById('pwa-banner').classList.remove('show');
    });

    document.getElementById('pwa-banner-close').addEventListener('click', () => {
      document.getElementById('pwa-banner').classList.remove('show');
      localStorage.setItem('pwa-dismissed', '1');
    });

    // iOS: Zeige Tipp wenn Safari + nicht installiert
    const isIos = /iphone|ipad|ipod/.test(navigator.userAgent.toLowerCase());
    const isInStandalone = window.navigator.standalone === true;
    if (isIos && !isInStandalone && !localStorage.getItem('ios-tip-dismissed')) {
      setTimeout(() => {
        document.getElementById('ios-tip').classList.add('show');
      }, 3000);
    }

    document.getElementById('ios-tip-close').addEventListener('click', () => {
      document.getElementById('ios-tip').classList.remove('show');
      localStorage.setItem('ios-tip-dismissed', '1');
    });
  </script>
</body>
</html>
