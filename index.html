<body>
  <div id="root"></div>

  <script src="i18n.js"></script>
  <script src="lang/de.js"></script>
  <script>
    (function(){
      var lang = localStorage.getItem('ft_lang');
      if (lang) { window._lang = lang; document.documentElement.lang = lang; }
      if (lang && lang !== 'de') {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', 'lang/' + lang + '.js', false);
        try { xhr.send(); if (xhr.status === 200) eval(xhr.responseText); } catch(e){}
      }
      var m = document.querySelector('meta[name="description"]');
      if (m && window.t) m.content = window.t('app.description');
    })();
  </script>
  <!-- App laden: gebautes app.js (schnell).
       Fallback ohne Build: "?dev=1" an die URL haengen oder app.js entfernen –
       dann wird src/app.jsx mit vendor/babel.min.js im Browser uebersetzt. -->
  <script>
    (function () {
      var dev = /(?:^|[?&])dev=1(?:&|$)/.test(location.search);
      var source = 'src/app.jsx';

      function fail(msg) {
        var root = document.getElementById('root');
        if (root) {
          root.innerHTML = '<p style="color:#fff;font:600 15px/1.6 Nunito,sans-serif;padding:24px">' +
            'FamTask konnte nicht geladen werden.<br><small style="opacity:.65">' +
            String(msg).replace(/[<>]/g, '') + '</small></p>';
        }
      }

      // Ohne Build: JSX im Browser uebersetzen (langsam, aber immer aktuell).
      function runFromSource() {
        var babel = document.createElement('script');
        babel.src = 'vendor/babel.min.js';
        babel.onerror = function () { fail('vendor/babel.min.js fehlt'); };
        babel.onload = function () {
          fetch(source, { cache: 'no-store' }).then(function (r) {
            if (!r.ok) throw new Error(source + ': HTTP ' + r.status);
            return r.text();
          }).then(function (code) {
            var out = Babel.transform(code, {
              presets: [['react', { runtime: 'classic' }]],
              filename: 'app.jsx'
            }).code;
            var s = document.createElement('script');
            s.text = out + '\n//# sourceURL=' + source;
            document.body.appendChild(s);
          }).catch(function (e) { fail(e.message || e); });
        };
        document.head.appendChild(babel);
      }

      if (dev) { runFromSource(); return; }

      var app = document.createElement('script');
      app.src = 'app.js?v=5f38fd51';
      app.onerror = runFromSource;   // app.js fehlt -> Quelltext-Weg
      document.body.appendChild(app);
    })();
  </script>

  <script>
    // Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
    }

    // ── PWA Install State ────────────────────────────────────────────────────
    window._pwa = {
      type:     null,   // 'android' | 'ios' | 'desktop' | null
      prompt:   null,   // deferredPrompt (Android/Desktop)
      canShow:  false,  // false nur wenn bereits installiert
      installed: false,
      listeners: [],
      notify() { this.listeners.forEach(fn => fn(this)); },
      subscribe(fn) { this.listeners.push(fn); fn(this); },
      install() {
        if (this.prompt) {
          this.prompt.prompt();
          this.prompt.userChoice.then(r => {
            if (r.outcome === 'accepted') {
              this.installed = true; this.canShow = false; this.notify();
            }
            this.prompt = null;
          });
        }
      }
    };

    // Bereits installiert (Standalone-Modus)? → nicht anzeigen
    const _isStandalone = window.navigator.standalone === true
      || window.matchMedia('(display-mode: standalone)').matches;

    if (_isStandalone) {
      window._pwa.installed = true;
      window._pwa.canShow   = false;
    } else {
      const _isIos = /iphone|ipad|ipod/.test(navigator.userAgent.toLowerCase());
      const _isIosSafari = _isIos && /safari/i.test(navigator.userAgent) && !/crios|fxios|opios/i.test(navigator.userAgent);

      if (_isIosSafari) {
        window._pwa.type    = 'ios';
        window._pwa.canShow = true;
        window._pwa.notify();
      } else {
        // Android / Desktop: auf beforeinstallprompt warten
        // Schon vorher canShow=true damit Button sofort sichtbar ist
        // (zeigt Anleitung bis Prompt bereit ist)
        window._pwa.type    = 'android';
        window._pwa.canShow = true;
        window._pwa.notify();

        window.addEventListener('beforeinstallprompt', (e) => {
          e.preventDefault();
          window._pwa.prompt = e;
          window._pwa.notify();
        });
      }
    }

    // Wenn App installiert wird → verstecken
    window.addEventListener('appinstalled', () => {
      window._pwa.installed = true;
      window._pwa.canShow   = false;
      window._pwa.notify();
    });

    // Auf Standalone-Wechsel reagieren (z.B. nach Installation neu geöffnet)
    window.matchMedia('(display-mode: standalone)').addEventListener('change', e => {
      if (e.matches) {
        window._pwa.installed = true;
        window._pwa.canShow   = false;
        window._pwa.notify();
      }
    });
  </script>
</body>
